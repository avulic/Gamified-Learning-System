  </text>
  
  <!-- Preview Area -->
  <rect x="655" y="550" width="310" height="125" rx="5" fill="#000000" stroke="#2d3748" stroke-width="2" />
  
  <!-- Dialogue Preview -->
  <rect x="675" y="570" width="270" height="80" rx="10" fill="#faf5ff" />
  <circle cx="695" cy="590" r="15" fill="#805ad5" />
  <text x="695" cy="590" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">
    E
  </text>
  <text x="720" y="590" font-family="Arial" font-size="14" fill="#553c9a" font-weight="bold">
