<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f0f4f8" />
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#2d3748" />
  <text x="30" y="38" font-family="Arial" font-size="24" fill="#ffffff" font-weight="bold">Entity-Task Mapper</text>
  
  <!-- Navigation Tabs -->
  <rect x="300" y="0" width="120" height="60" fill="#2d3748" />
  <text x="360" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#a0aec0">World</text>
  
  <rect x="420" y="0" width="120" height="60" fill="#2d3748" />
  <text x="480" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#a0aec0">Modules</text>
  
  <rect x="540" y="0" width="120" height="60" fill="#2d3748" />
  <text x="600" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#a0aec0">Sprites</text>
  
  <rect x="660" y="0" width="120" height="60" fill="#4a5568" />
  <text x="720" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#ffffff">Tasks</text>
  
  <rect x="780" y="0" width="120" height="60" fill="#2d3748" />
  <text x="840" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#a0aec0">Story</text>
  
  <!-- Left Panel - Tasks -->
  <rect x="0" y="60" width="350" height="640" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Tasks Header -->
  <rect x="0" y="60" width="350" height="50" fill="#edf2f7" />
  <text x="20" y="92" font-family="Arial" font-size="18" fill="#4a5568" font-weight="bold">Assignment Tasks</text>
  
  <!-- Task Filter -->
  <rect x="20" y="120" width="310" height="40" rx="5" fill="#ebf8ff" />
  <text x="40" y="145" font-family="Arial" font-size="16" fill="#2c5282">Filter by Module:</text>
  <rect x="180" y="125" width="140" height="30" rx="3" fill="#ffffff" stroke="#90cdf4" stroke-width="1" />
  <text x="195" y="145" font-family="Arial" font-size="14" fill="#4a5568">Data Structures</text>
  <path d="M305,140 L310,145 L315,140" stroke="#4a5568" stroke-width="2" fill="none" />
  
  <!-- Task List - Data Structures -->
  <rect x="20" y="170" width="310" height="40" rx="5" fill="#ebf8ff" />
  <text x="40" y="195" font-family="Arial" font-size="16" fill="#2c5282" font-weight="bold">Data Structures Module</text>
  
  <!-- Task Items - Currently selected -->
  <rect x="20" y="220" width="310" height="90" rx="5" fill="#e6fffa" stroke="#38b2ac" stroke-width="2" />
  <text x="40" y="240" font-family="Arial" font-size="16" fill="#234e52" font-weight="bold">
    Task 1: Binary Search Tree
  </text>
  <text x="40" y="265" font-family="Arial" font-size="14" fill="#2c7a7b">
    <tspan x="40" dy="0">Implement a balanced binary search tree</tspan>
    <tspan x="40" dy="20">to organize a collection of items</tspan>
  </text>
  <rect x="40" y="290" width="60" height="10" rx="5" fill="#38b2ac" />
  <text x="110" y="298" font-family="Arial" font-size="12" fill="#718096">Assigned</text>
  
  <rect x="20" y="320" width="310" height="90" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="40" y="340" font-family="Arial" font-size="16" fill="#4a5568" font-weight="bold">
    Task 2: Graph Traversal
  </text>
  <text x="40" y="365" font-family="Arial" font-size="14" fill="#718096">
    <tspan x="40" dy="0">Implement BFS and DFS algorithms to</tspan>
    <tspan x="40" dy="20">traverse a graph structure</tspan>
  </text>
  <rect x="40" y="390" width="60" height="10" rx="5" fill="#e2e8f0" />
  <text x="110" y="398" font-family="Arial" font-size="12" fill="#718096">Draft</text>
  
  <rect x="20" y="420" width="310" height="90" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="40" y="440" font-family="Arial" font-size="16" fill="#4a5568" font-weight="bold">
    Task 3: Hash Tables
  </text>
  <text x="40" y="465" font-family="Arial" font-size="14" fill="#718096">
    <tspan x="40" dy="0">Create a hash function and handle</tspan>
    <tspan x="40" dy="20">collisions for optimal performance</tspan>
  </text>
  <rect x="40" y="490" width="60" height="10" rx="5" fill="#e2e8f0" />
  <text x="110" y="498" font-family="Arial" font-size="12" fill="#718096">Draft</text>
  
  <!-- Task List - Algorithms -->
  <rect x="20" y="520" width="310" height="40" rx="5" fill="#ebf8ff" />
  <text x="40" y="545" font-family="Arial" font-size="16" fill="#2c5282" font-weight="bold">Algorithms Module</text>
  
  <rect x="20" y="570" width="310" height="90" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="40" y="590" font-family="Arial" font-size="16" fill="#4a5568" font-weight="bold">
    Task 4: Sorting Algorithms
  </text>
  <text x="40" y="615" font-family="Arial" font-size="14" fill="#718096">
    <tspan x="40" dy="0">Implement and compare performance of</tspan>
    <tspan x="40" dy="20">various sorting algorithms</tspan>
  </text>
  <rect x="40" y="640" width="60" height="10" rx="5" fill="#4299e1" />
  <text x="110" y="648" font-family="Arial" font-size="12" fill="#718096">Published</text>
  
  <!-- Middle Panel - Task Mapper -->
  <rect x="350" y="60" width="500" height="640" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Task Mapping Header -->
  <rect x="350" y="60" width="500" height="50" fill="#edf2f7" />
  <text x="370" y="92" font-family="Arial" font-size="18" fill="#4a5568" font-weight="bold">Map Task to Game Entities</text>
  
  <!-- Selected Task Information -->
  <rect x="370" y="120" width="460" height="70" rx="5" fill="#e6fffa" stroke="#38b2ac" stroke-width="1" />
  <text x="390" y="145" font-family="Arial" font-size="16" fill="#234e52" font-weight="bold">
    Task 1: Binary Search Tree Implementation
  </text>
  <text x="390" y="170" font-family="Arial" font-size="14" fill="#2c7a7b">
    <tspan x="390" dy="0">Students will create a balanced binary search tree to organize</tspan>
    <tspan x="390" dy="20">the village library's ancient scrolls collection</tspan>
  </text>
  
  <!-- Connection Diagram -->
  <rect x="370" y="200" width="460" height="370" rx="5" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Game Character -->
  <circle cx="480" cy="260" r="40" fill="#805ad5" stroke="#553c9a" stroke-width="2" />
  <text x="480" y="265" font-family="Arial" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">E</text>
  <text x="480" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="bold">Village Elder</text>
  
  <!-- Game Object -->
  <circle cx="600" cy="400" r="40" fill="#f6ad55" stroke="#dd6b20" stroke-width="2" />
  <text x="600" y="405" font-family="Arial" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">S</text>
  <text x="600" y="460" font-family="Arial" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="bold">Ancient Scrolls</text>
  
  <!-- Game Location -->
  <rect x="680" y="260" width="80" height="80" rx="10" fill="#805ad5" stroke="#553c9a" stroke-width="2" />
  <text x="720" y="305" font-family="Arial" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">L</text>
  <text x="720" y="360" font-family="Arial" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="bold">Library</text>
  
  <!-- Connection Lines -->
  <line x1="520" y1="260" x2="680" y2="260" stroke="#553c9a" stroke-width="3" stroke-dasharray="10,5" />
  <text x="600" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="#553c9a">Located at</text>
  
  <line x1="480" y1="300" x2="570" y2="380" stroke="#dd6b20" stroke-width="3" stroke-dasharray="10,5" />
  <text x="510" y="350" font-family="Arial" font-size="12" text-anchor="middle" fill="#dd6b20">Asks for help</text>
  
  <line x1="630" y1="370" x2="680" y2="320" stroke="#dd6b20" stroke-width="3" stroke-dasharray="10,5" />
  <text x="670" y="330" font-family="Arial" font-size="12" text-anchor="middle" fill="#dd6b20">Stored in</text>
  
  <!-- Connection to Task -->
  <rect x="530" y="500" width="120" height="50" rx="5" fill="#38b2ac" stroke="#234e52" stroke-width="2" />
  <text x="590" y="530" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">TASK 1</text>
  
  <line x1="480" y1="320" x2="540" y2="500" stroke="#234e52" stroke-width="3" />
  <text x="500" y="410" font-family="Arial" font-size="12" text-anchor="middle" fill="#234e52">Quest Giver</text>
  
  <line x1="600" y1="440" x2="580" y2="500" stroke="#234e52" stroke-width="3" />
  <text x="570" y="470" font-family="Arial" font-size="12" text-anchor="middle" fill="#234e52">Subject</text>
  
  <line x1="720" y1="360" x2="640" y2="500" stroke="#234e52" stroke-width="3" />
  <text x="690" y="430" font-family="Arial" font-size="12" text-anchor="middle" fill="#234e52">Location</text>
  
  <!-- Story Integration -->
