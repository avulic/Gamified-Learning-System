  <!-- Dialogue Tree -->
  <rect x="285" y="140" width="330" height="535" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  
  <!-- Dialogue Node 1 -->
  <rect x="305" y="155" width="290" height="110" rx="5" fill="#ffffff" stroke="#805ad5" stroke-width="2" />
  <circle cx="325" cy="175" r="15" fill="#805ad5" />
