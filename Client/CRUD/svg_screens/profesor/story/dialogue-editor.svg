  <text x="675" y="225" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">
    Dialogue Text:
  </text>
  <rect x="675" y="235" width="270" height="110" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="685" y="255" font-family="Arial" font-size="14" fill="#718096">
    <tspan x="685" dy="0">We need a powerful data structure</tspan>
    <tspan x="685" dy="20">called a binary search tree to sort</tspan>
    <tspan x="685" dy="20">our scrolls efficiently.</tspan>
  </text>
  
  <!-- Conditions and Variables -->
  <rect x="655" y="370" width="310" height="80" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  <text x="675" y="395" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">
    Conditional Display:
  </text>
  <rect x="675" y="405" width="270" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="685" y="425" font-family="Arial" font-size="14" fill="#718096">
    if (selectedOption === "How can I help you organize them?")
  </text>
  
  <!-- Task Association -->
  <rect x="655" y="460" width="310" height="80" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  <text x="675" y="485" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">
