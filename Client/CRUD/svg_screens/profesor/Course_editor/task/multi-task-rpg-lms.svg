<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780">
  <!-- Background -->
  <rect width="1000" height="780" fill="#f0f4f8" />
  
  <!-- Header text -->
  <text x="500" y="35" font-family="Arial" font-size="24" text-anchor="middle" fill="#2d3748" font-weight="bold">
    Multi-Task RPG Learning Management System
  </text>
  
  <!-- Left Panel - Professor's Assignment Editor -->
  <rect x="20" y="55" width="460" height="710" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="2" />
  <text x="250" y="85" font-family="Arial" font-size="20" text-anchor="middle" fill="#4a5568" font-weight="bold">
    Professor's Assignment Editor
  </text>
  
  <!-- Assignment Title -->
  <rect x="40" y="95" width="420" height="60" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  <text x="60" y="120" font-family="Arial" font-size="16" fill="#4a5568" font-weight="bold">
    Assignment Title: 
  </text>
  <rect x="180" y="105" width="260" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="190" y="125" font-family="Arial" font-size="14" fill="#718096">
    Data Structures Adventure Quest
  </text>
  
  <!-- Story Editor -->
  <rect x="40" y="165" width="420" height="120" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  <text x="60" y="190" font-family="Arial" font-size="16" fill="#4a5568" font-weight="bold">
    Quest Storyline:
  </text>
  <rect x="60" y="200" width="380" height="70" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="70" y="220" font-family="Arial" font-size="14" fill="#718096">
    <tspan x="70" dy="0">The ancient library of Algorithmia has been thrown into</tspan>
    <tspan x="70" dy="20">chaos. The Elder Council needs your help to organize</tspan>
    <tspan x="70" dy="20">the knowledge and restore order to the realm.</tspan>
  </text>
  
  <!-- Task Management Tabs -->
  <rect x="40" y="295" width="420" height="40" rx="5" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="1" />
  
  <rect x="45" y="300" width="100" height="30" rx="5" fill="#3182ce" />
  <text x="95" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">
    Tasks
  </text>
  
  <rect x="150" y="300" width="100" height="30" rx="5" fill="#e2e8f0" />
  <text x="200" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#4a5568">
    Map
  </text>
  
  <rect x="255" y="300" width="100" height="30" rx="5" fill="#e2e8f0" />
  <text x="305" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#4a5568">
    Rewards
  </text>
  
  <rect x="360" y="300" width="95" height="30" rx="5" fill="#e2e8f0" />
  <text x="407" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#4a5568">
    Settings
  </text>
  
  <!-- Task List -->
  <rect x="40" y="345" width="420" height="380" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  
  <!-- Task 1 (expanded/editing) -->
  <rect x="50" y="355" width="400" height="170" rx="5" fill="#ebf8ff" stroke="#4299e1" stroke-width="2" />
  <text x="70" y="375" font-family="Arial" font-size="16" fill="#2c5282" font-weight="bold">
    Task 1: Binary Search Tree Implementation
  </text>
  
  <rect x="70" y="385" width="360" height="60" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="80" y="405" font-family="Arial" font-size="14" fill="#718096">
    <tspan x="80" dy="0">Implement a balanced binary search tree to help</tspan>
    <tspan x="80" dy="20">organize the ancient scrolls in the library.</tspan>
  </text>
  
  <!-- Task 1 Game Element Association -->
  <text x="70" y="465" font-family="Arial" font-size="14" fill="#4a5568">
    Associated Game Elements:
  </text>
  <rect x="70" y="475" width="140" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <circle cx="85" cy="490" r="10" fill="#805ad5" />
  <text x="105" y="495" font-family="Arial" font-size="14" fill="#718096">Village Elder</text>
  
  <rect x="220" y="475" width="140" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <circle cx="235" cy="490" r="10" fill="#f6ad55" />
  <text x="255" y="495" font-family="Arial" font-size="14" fill="#718096">Scrolls</text>
  
  <line x1="370" y1="490" x2="390" y2="490" stroke="#4a5568" stroke-width="2" />
  <line x1="380" y1="480" x2="380" y2="500" stroke="#4a5568" stroke-width="2" />
  
  <!-- Task 2 -->
  <rect x="50" y="535" width="400" height="40" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="70" y="560" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">
    Task 2: Graph Pathfinding
  </text>
  <circle cx="420" cy="555" r="10" fill="#68d391" />
  <circle cx="390" cy="555" r="10" fill="#90cdf4" />
  
  <!-- Task 3 -->
  <rect x="50" y="585" width="400" height="40" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="70" y="610" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">
    Task 3: Sorting Algorithm
  </text>
  <circle cx="420" cy="605" r="10" fill="#fc8181" />
  
  <!-- Task 4 -->
  <rect x="50" y="635" width="400" height="40" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="70" y="660" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">
    Task 4: Hash Function Challenge
  </text>
  <circle cx="420" cy="655" r="10" fill="#f6e05e" />
  
  <!-- Add New Task Button -->
  <rect x="50" y="685" width="400" height="30" rx="15" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="1" />
  <text x="250" y="705" font-family="Arial" font-size="14" text-anchor="middle" fill="#4a5568">
    + Add New Task
  </text>
  
  <!-- Bottom Panel -->
  <rect x="40" y="735" width="420" height="20" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  <rect x="320" y="735" width="120" height="20" rx="5" fill="#4299e1" />
  <text x="380" y="750" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">
    Save Assignment
  </text>
  
  <!-- Right Panel - Game World Map Editor -->
  <rect x="520" y="55" width="460" height="400" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="2" />
  <text x="750" y="85" font-family="Arial" font-size="20" text-anchor="middle" fill="#4a5568" font-weight="bold">
    Game World Map Editor
  </text>
  
  <!-- Game Map Canvas -->
  <rect x="540" y="95" width="420" height="340" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  
  <!-- Game world elements -->
  <!-- Library area -->
  <rect x="580" y="135" width="120" height="80" fill="#805ad5" rx="5" />
  <rect x="600" y="135" width="80" height="5" fill="#553c9a" />
  <rect x="630" y="185" width="20" height="30" fill="#553c9a" />
  <text x="640" y="170" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">
    Library
  </text>
  
  <!-- Elder NPC -->
  <circle cx="640" cy="230" r="15" fill="#805ad5" stroke="#553c9a" stroke-width="2" />
  <text x="640" y="235" font-family="Arial" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">
    E
  </text>
  
  <!-- Scrolls -->
  <circle cx="610" cy="250" r="8" fill="#f6ad55" />
  <circle cx="625" cy="250" r="8" fill="#f6ad55" />
  <circle cx="640" cy="250" r="8" fill="#f6ad55" />
  
  <!-- Task 1 Connection -->
  <line x1="640" y1="250" x2="440" y2="470" stroke="#f6ad55" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="640" y1="230" x2="440" y2="470" stroke="#805ad5" stroke-width="2" stroke-dasharray="5,3" />
  
  <!-- Forest area -->
  <circle cx="730" cy="200" r="15" fill="#68d391" />
  <circle cx="760" cy="190" r="18" fill="#68d391" />
  <circle cx="750" cy="220" r="20" fill="#68d391" />
  <circle cx="780" cy="210" r="15" fill="#68d391" />
  <text x="755" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#276749" font-weight="bold">
    Forest
  </text>
  
  <!-- Lake area -->
  <circle cx="830" cy="300" r="35" fill="#90cdf4" />
  <circle cx="805" cy="320" r="20" fill="#90cdf4" />
  <circle cx="855" cy="320" r="15" fill="#90cdf4" />
  <text x="830" y="305" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c5282" font-weight="bold">
    Lake
  </text>
  
  <!-- Task 2 Connection -->
  <line x1="755" y1="205" x2="440" y2="550" stroke="#68d391" stroke-width="2" stroke-dasharray="5,3" />
  <line x1="830" y1="300" x2="440" y2="550" stroke="#90cdf4" stroke-width="2" stroke-dasharray="5,3" />
  
  <!-- Tournament area -->
  <circle cx="650" cy="350" r="30" fill="#fc8181" />
  <polygon points="630,330 650,310 670,330 670,370 650,390 630,370" fill="#fc8181" stroke="#c53030" stroke-width="2" />
  <text x="650" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#742a2a" font-weight="bold">
    Arena
  </text>
  
  <!-- Task 3 Connection -->
  <line x1="650" y1="350" x2="440" y2="605" stroke="#fc8181" stroke-width="2" stroke-dasharray="5,3" />
  
  <!-- Treasury area -->
  <rect x="740" cy="350" width="50" height="50" fill="#f6e05e" stroke="#d69e2e" stroke-width="2" />
  <circle cx="765" cy="375" r="15" fill="#faf089" />
  <text x="765" y="375" font-family="Arial" font-size="12" text-anchor="middle" fill="#744210" font-weight="bold">
    Treasury
  </text>
  
  <!-- Task 4 Connection -->
  <line x1="765" y1="375" x2="440" y2="655" stroke="#f6e05e" stroke-width="2" stroke-dasharray="5,3" />
  
  <!-- Map Editor Tools -->
  <circle cx="900" cy="130" r="15" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" />
  <text x="900" y="135" font-family="Arial" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">
    P
  </text>
  <text x="925" y="135" font-family="Arial" font-size="14" fill="#4a5568">
    Player Start
  </text>
  
  <rect x="880" y="160" width="60" height="20" rx="10" fill="#4299e1" />
  <text x="910" y="175" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">
    Add NPC
  </text>
  
  <rect x="880" y="190" width="60" height="20" rx="10" fill="#4299e1" />
  <text x="910" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">
    Add Object
  </text>
  
  <rect x="880" y="220" width="60" height="20" rx="10" fill="#4299e1" />
  <text x="910" y="235" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">
    Add Location
  </text>
  
  <!-- Right Bottom Panel - Rewards Configuration -->
  <rect x="520" y="465" width="460" height="300" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="2" />
  <text x="750" y="495" font-family="Arial" font-size="20" text-anchor="middle" fill="#4a5568" font-weight="bold">
    Quest Rewards Configuration
  </text>
  
  <!-- Task reward mapping -->
  <rect x="540" y="515" width="420" height="40" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  <text x="560" y="540" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">
    Task 1: Binary Search Tree Implementation
  </text>
  <rect x="750" y="520" width="65" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="782" y="540" font-family="Arial" font-size="14" text-anchor="middle" fill="#718096">
    100 XP
  </text>
  <rect x="825" y="520" width="120" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="885" y="540" font-family="Arial" font-size="14" text-anchor="middle" fill="#718096">
    Data Structures +15
  </text>
  
  <rect x="540" y="565" width="420" height="40" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  <text x="560" y="590" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">
    Task 2: Graph Pathfinding
  </text>
  <rect x="750" y="570" width="65" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="782" y="590" font-family="Arial" font-size="14" text-anchor="middle" fill="#718096">
    120 XP
  </text>
  <rect x="825" y="570" width="120" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="885" y="590" font-family="Arial" font-size="14" text-anchor="middle" fill="#718096">
    Algorithms +20
  </text>
  
  <rect x="540" y="615" width="420" height="40" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  <text x="560" y="640" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">
    Task 3: Sorting Algorithm
  </text>
  <rect x="750" y="620" width="65" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="782" y="640" font-family="Arial" font-size="14" text-anchor="middle" fill="#718096">
    80 XP
  </text>
  <rect x="825" y="620" width="120" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="885" y="640" font-family="Arial" font-size="14" text-anchor="middle" fill="#718096">
    Algorithms +10
  </text>
  
  <rect x="540" y="665" width="420" height="40" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
  <text x="560" y="690" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">
    Task 4: Hash Function Challenge
  </text>
  <rect x="750" y="670" width="65" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="782" y="690" font-family="Arial" font-size="14" text-anchor="middle" fill="#718096">
    150 XP
  </text>
  <rect x="825" y="670" width="120" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="885" y="690" font-family="Arial" font-size="14" text-anchor="middle" fill="#718096">
    Hashing +25
  </text>
  
  <!-- Completion Bonus -->
  <rect x="540" y="715" width="420" height="40" rx="5" fill="#faf5ff" stroke="#d6bcfa" stroke-width="2" />
  <text x="560" y="740" font-family="Arial" font-size="14" fill="#553c9a" font-weight="bold">
    Quest Completion Bonus
  </text>
  <rect x="750" y="720" width="65" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="782" y="740" font-family="Arial" font-size="14" text-anchor="middle" fill="#718096">
    250 XP
  </text>
  <rect x="825" y="720" width="120" height="30" rx="3" fill="#ffffff" stroke="#a0aec0" stroke-width="1" />
  <text x="885" y="740" font-family="Arial" font-size="14" text-anchor="middle" fill="#718096">
    Enchanted Scroll
  </text>
</svg>
