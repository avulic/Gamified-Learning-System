    <tspan x="335" dy="20">I need your help organizing our</tspan>
    <tspan x="335" dy="20">knowledge scrolls.</tspan>
  </text>
  
  <!-- Connection line between nodes -->
  <line x1="450" y1="265" x2="450" y2="280" stroke="#a0aec0" stroke-width="2" stroke-dasharray="5,3" />
  <circle cx="450" cy="280" r="5" fill="#a0aec0" />
  
  <!-- Dialogue Node 2 - Player Response Options -->
