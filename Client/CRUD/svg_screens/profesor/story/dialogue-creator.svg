<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f7fa" rx="8" ry="8"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#9c27b0" rx="8" ry="8"/>
  <text x="30" y="38" font-family="Arial" font-size="22" fill="white" font-weight="bold">Dialogue Creator</text>
  
  <!-- Tab Navigation -->
  <rect x="30" y="80" width="140" height="40" fill="#e1bee7" rx="6" ry="6"/>
  <text x="70" y="105" font-family="Arial" font-size="14" fill="#9c27b0">Story Editor</text>
  
  <rect x="180" y="80" width="140" height="40" fill="#9c27b0" rx="6" ry="6"/>
  <text x="200" y="105" font-family="Arial" font-size="14" fill="white">Dialogue Creator</text>
  
  <rect x="330" y="80" width="140" height="40" fill="#e1bee7" rx="6" ry="6"/>
  <text x="350" y="105" font-family="Arial" font-size="14" fill="#9c27b0">Story Path Editor</text>
  
  <!-- Character Selection Area -->
  <rect x="30" y="140" width="250" height="120" fill="white" stroke="#ddd" stroke-width="1" rx="6" ry="6"/>
  <rect x="30" y="140" width="250" height="40" fill="#f0f3f9" rx="6" ry="6"/>
  <text x="45" y="165" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Characters</text>
  
  <!-- Character Dropdown -->
  <rect x="45" y="190" width="220" height="30" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="60" y="210" font-family="Arial" font-size="14" fill="#333">Forest Guide</text>
  <text x="245" y="210" font-family="Arial" font-size="14" fill="#999">▼</text>
  
  <!-- Character View Toggle -->
  <rect x="45" y="230" width="100" height="20" fill="#e1bee7" rx="10" ry="10"/>
  <text x="58" y="245" font-family="Arial" font-size="12" fill="#9c27b0">Speaking To</text>
  
  <rect x="155" y="230" width="110" height="20" fill="#f0f3f9" rx="10" ry="10"/>
  <text x="170" y="245" font-family="Arial" font-size="12" fill="#555">Mentioned</text>
  
  <!-- Educational Context Area -->
  <rect x="30" y="270" width="250" height="120" fill="white" stroke="#ddd" stroke-width="1" rx="6" ry="6"/>
  <rect x="30" y="270" width="250" height="40" fill="#f0f3f9" rx="6" ry="6"/>
  <text x="45" y="295" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Educational Context</text>
  
  <!-- Context Inputs -->
  <text x="45" y="330" font-family="Arial" font-size="13" fill="#555">Learning Objective:</text>
  <rect x="45" y="340" width="220" height="25" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="55" y="357" font-family="Arial" font-size="12" fill="#333">Understand photosynthesis principles</text>
  
  <!-- Quest Association -->
  <rect x="30" y="400" width="250" height="170" fill="white" stroke="#ddd" stroke-width="1" rx="6" ry="6"/>
  <rect x="30" y="400" width="250" height="40" fill="#f0f3f9" rx="6" ry="6"/>
  <text x="45" y="425" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Associated Quest</text>
  
  <rect x="45" y="450" width="220" height="30" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="55" y="470" font-family="Arial" font-size="13" fill="#333">The Great Photosynthesis Challenge</text>
  <text x="245" y="470" font-family="Arial" font-size="14" fill="#999">▼</text>
  
  <text x="45" y="500" font-family="Arial" font-size="13" fill="#555">Dialogue Position:</text>
  <rect x="45" y="510" width="220" height="25" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="55" y="527" font-family="Arial" font-size="12" fill="#333">Quest Introduction</text>
  <text x="245" y="527" font-family="Arial" font-size="14" fill="#999">▼</text>
  
  <!-- Dialogue Builder Main Area -->
  <rect x="300" y="140" width="470" height="430" fill="white" stroke="#ddd" stroke-width="1" rx="6" ry="6"/>
  <rect x="300" y="140" width="470" height="40" fill="#f0f3f9" rx="6" ry="6"/>
  <text x="320" y="165" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Dialogue Sequence</text>
  
  <!-- Character Avatar and First Dialogue -->
  <circle cx="335" cy="210" r="25" fill="#a5d6a7"/>
  <rect x="330" y="235" width="10" height="15" fill="#66bb6a"/>
  
  <path d="M370 180 L650 180 L650 230 L390 230 L370 250 L370 230 L370 180" fill="#f3e5f5" stroke="#d1c4e9"/>
  <text x="390" y="200" font-family="Arial" font-size="13" fill="#333" font-weight="bold">Forest Guide:</text>
  <text x="390" y="220" font-family="Arial" font-size="13" fill="#555">Welcome to the Ancient Forest! Have you noticed that some of our plants seem to be struggling lately?</text>
  
  <!-- Student Response Options -->
  <rect x="370" y="280" width="380" height="40" fill="#fff" stroke="#d1c4e9" stroke-width="1" rx="20" ry="20"/>
  <text x="390" y="305" font-family="Arial" font-size="13" fill="#555">Yes, I can see some of them have yellowing leaves.</text>
  <circle cx="725" cy="300" r="8" fill="#f0f3f9" stroke="#9c27b0" stroke-width="1"/>
  <text x="722" y="304" font-family="Arial" font-size="12" fill="#9c27b0">+</text>
  
  <rect x="370" y="330" width="380" height="40" fill="#fff" stroke="#d1c4e9" stroke-width="1" rx="20" ry="20"/>
  <text x="390" y="355" font-family="Arial" font-size="13" fill="#555">No, I hadn't noticed. What's happening to them?</text>
  <circle cx="725" cy="350" r="8" fill="#f0f3f9" stroke="#9c27b0" stroke-width="1"/>
  <text x="722" y="354" font-family="Arial" font-size="12" fill="#9c27b0">+</text>
  
  <rect x="370" y="380" width="380" height="40" fill="#fff" stroke="#d1c4e9" stroke-width="1" rx="20" ry="20"/>
  <text x="390" y="405" font-family="Arial" font-size="13" fill="#555">I'm interested in learning about how plants stay healthy.</text>
  <circle cx="725" cy="400" r="8" fill="#f0f3f9" stroke="#9c27b0" stroke-width="1"/>
  <text x="722" y="404" font-family="Arial" font-size="12" fill="#9c27b0">+</text>
  
  <!-- Add Response Button -->
  <circle cx="560" cy="450" r="20" fill="#9c27b0"/>
  <text x="555" y="455" font-family="Arial" font-size="18" fill="white">+</text>
  
  <!-- Next Dialogue Placeholder -->
  <rect x="370" y="480" width="380" height="40" fill="#f0f3f9" rx="4" ry="4" opacity="0.7"/>
  <text x="505" y="505" font-family="Arial" font-size="13" fill="#777" text-anchor="middle">Next dialogue will appear here...</text>
  
  <!-- Educational Hint -->
  <rect x="30" y="580" width="740" height="20" fill="#f0f3f9"/>
  <text x="370" y="595" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">💡 This dialogue introduces the photosynthesis concept through a real-world ecosystem problem</text>
</svg>
