  <text x="335" y="403" font-family="Arial" font-size="14" fill="#2c5282">
    [Leave] I'll come back later.
  </text>
  
  <!-- Connection line between nodes -->
  <line x1="450" y1="415" x2="450" y2="430" stroke="#a0aec0" stroke-width="2" stroke-dasharray="5,3" />
  <circle cx="450" cy="430" r="5" fill="#a0aec0" />
  
  <!-- Dialogue Node 3 - Conditional response based on selection -->
  <rect x="305" y="440" width="290" height="110" rx="5" fill="#ffffff" stroke="#805ad5" stroke-width="2" />
  <circle cx="325" cy="460" r="15" fill="#805ad5" />
  <text x="325" cy="460" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">
