<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#222639" rx="8" ry="8"/>
  
  <!-- Header/Status Bar -->
  <rect x="0" y="0" width="800" height="60" fill="#1a1e2e" rx="8" ry="8"/>
  
  <!-- Character Name and Level -->
  <text x="30" y="38" font-family="Arial" font-size="18" fill="#e0e6ff" font-weight="bold">Alex the Biologist</text>
  <text x="220" y="38" font-family="Arial" font-size="16" fill="#8b97c6">Level 12 | Knowledge Path: Life Sciences</text>
  
  <!-- Status Indicators -->
  <rect x="550" y="15" width="100" height="30" fill="#2a324b" rx="15" ry="15"/>
  <text x="565" y="35" font-family="Arial" font-size="14" fill="#4fc3f7">XP: 2450/3000</text>
  
  <rect x="670" y="15" width="100" height="30" fill="#2a324b" rx="15" ry="15"/>
  <text x="685" y="35" font-family="Arial" font-size="14" fill="#81c784">Quests: 4</text>
  
  <!-- Main Game Map Area -->
  <rect x="30" y="80" width="530" height="420" fill="#2d3d51" stroke="#5d6e91" stroke-width="2" rx="8" ry="8"/>
  
  <!-- Game World - World Map Overview -->
  <!-- Mountains region (Physics Module) -->
  <path d="M80 200 L140 130 L200 210 L260 140 L320 220 Z" fill="#516a8c" stroke="#5d6e91" stroke-width="1"/>
  <text x="200" y="180" font-family="Arial" font-size="16" fill="#e0e6ff">Physics Peaks</text>
  
  <!-- Forest region (Biology Module) -->
  <path d="M250 250 Q350 180, 450 250 Q400 340, 250 250 Z" fill="#355e3b" stroke="#5d6e91" stroke-width="1"/>
  <text x="350" y="240" font-family="Arial" font-size="16" fill="#e0e6ff">Ancient Forest</text>
  
  <!-- Desert region (Chemistry Module) -->
  <path d="M100 340 Q220 380, 340 340 L320 450 L80 450 Z" fill="#856f45" stroke="#5d6e91" stroke-width="1"/>
  <text x="200" y="400" font-family="Arial" font-size="16" fill="#e0e6ff">Chemistry Sands</text>
  
  <!-- Lake (Math Module) -->
  <ellipse cx="480" cy="400" rx="70" ry="50" fill="#31658c" stroke="#5d6e91" stroke-width="1"/>
  <text x="480" y="400" font-family="Arial" font-size="16" fill="#e0e6ff" text-anchor="middle">Math Lake</text>
  
  <!-- Learning Path -->
  <path d="M180 300 L270 260 L360 340 L470 400" fill="none" stroke="#f9a825" stroke-width="4" stroke-dasharray="8,4"/>
  
  <!-- Player Location -->
  <circle cx="360" cy="340" r="15" fill="#4fc3f7"/>
  <polygon points="360,325 350,350 370,350" fill="#7986cb"/>
  
  <!-- Quest Markers -->
  <circle cx="250" cy="260" r="12" fill="#f9a825" stroke="#ffcc80" stroke-width="2"/>
  <text x="250" y="265" font-family="Arial" font-size="14" fill="#222639" font-weight="bold" text-anchor="middle">!</text>
  
  <circle cx="480" cy="400" r="12" fill="#f9a825" stroke="#ffcc80" stroke-width="2"/>
  <text x="480" y="405" font-family="Arial" font-size="14" fill="#222639" font-weight="bold" text-anchor="middle">!</text>
  
  <circle cx="180" cy="300" r="12" fill="#7e57c2" stroke="#b39ddb" stroke-width="2"/>
  <text x="180" y="305" font-family="Arial" font-size="14" fill="#222639" font-weight="bold" text-anchor="middle">?</text>
  
  <circle cx="470" cy="240" r="12" fill="#4caf50" stroke="#a5d6a7" stroke-width="2"/>
  <text x="470" y="245" font-family="Arial" font-size="14" fill="#222639" font-weight="bold" text-anchor="middle">✓</text>
  
  <!-- Location Info Panel -->
  <rect x="60" y="120" width="200" height="40" fill="#1a1e2e" rx="5" ry="5" opacity="0.85"/>
  <text x="75" y="145" font-family="Arial" font-size="14" fill="#e0e6ff" font-weight="bold">Current Location: Biology Region</text>
  
  <!-- Map Legend -->
  <rect x="45" y="430" width="500" height="55" fill="#1a1e2e" rx="5" ry="5" opacity="0.7"/>
  <circle cx="65" cy="450" r="8" fill="#f9a825"/>
  <text x="80" y="455" font-family="Arial" font-size="12" fill="#e0e6ff">Active Quest</text>
  
  <circle cx="180" cy="450" r="8" fill="#7e57c2"/>
  <text x="195" y="455" font-family="Arial" font-size="12" fill="#e0e6ff">NPC Dialogue</text>
  
  <circle cx="320" cy="450" r="8" fill="#4caf50"/>
  <text x="335" y="455" font-family="Arial" font-size="12" fill="#e0e6ff">Completed Task</text>
  
  <circle cx="450" cy="450" r="8" fill="#4fc3f7"/>
  <text x="465" y="455" font-family="Arial" font-size="12" fill="#e0e6ff">You</text>
  
  <!-- Quest & Info Panel -->
  <rect x="580" y="80" width="190" height="210" fill="#2a324b" stroke="#5d6e91" stroke-width="2" rx="8" ry="8"/>
  <rect x="580" y="80" width="190" height="40" fill="#1a1e2e" rx="8" ry="8"/>
  <text x="630" y="105" font-family="Arial" font-size="14" fill="#e0e6ff" font-weight="bold">Active Quests</text>
  
  <!-- Quest Entries -->
  <rect x="595" y="130" width="160" height="50" fill="#354052" rx="5" ry="5"/>
  <circle cx="610" cy="155" r="7" fill="#f9a825"/>
  <text x="625" y="145" font-family="Arial" font-size="11" fill="#e0e6ff" font-weight="bold">The Great Photosynthesis</text>
  <text x="625" y="165" font-family="Arial" font-size="11" fill="#e0e6ff" font-weight="bold">Challenge</text>
  <text x="625" y="180" font-family="Arial" font-size="9" fill="#8b97c6">Ancient Forest - 2/3 tasks</text>
  
  <rect x="595" y="190" width="160" height="50" fill="#354052" rx="5" ry="5"/>
  <circle cx="610" cy="215" r="7" fill="#f9a825"/>
  <text x="625" y="205" font-family="Arial" font-size="11" fill="#e0e6ff" font-weight="bold">Mathematical Models</text>
  <text x="625" y="225" font-family="Arial" font-size="11" fill="#e0e6ff" font-weight="bold">of Growth</text>
  <text x="625" y="240" font-family="Arial" font-size="9" fill="#8b97c6">Math Lake - 0/4 tasks</text>
  
  <!-- Region Info Panel -->
  <rect x="580" y="310" width="190" height="190" fill="#2a324b" stroke="#5d6e91" stroke-width="2" rx="8" ry="8"/>
  <rect x="580" y="310" width="190" height="40" fill="#1a1e2e" rx="8" ry="8"/>
  <text x="630" y="335" font-family="Arial" font-size="14" fill="#e0e6ff" font-weight="bold">Region Info</text>
  
  <!-- Region Details -->
  <text x="595" y="365" font-family="Arial" font-size="12" fill="#e0e6ff" font-weight="bold">Ancient Forest</text>
  <text x="595" y="385" font-family="Arial" font-size="11" fill="#8b97c6">Domain: Life Sciences</text>
  <text x="595" y="405" font-family="Arial" font-size="11" fill="#8b97c6">Level Requirement: 10+</text>
  <text x="595" y="425" font-family="Arial" font-size="11" fill="#8b97c6">Knowledge Areas:</text>
  <text x="615" y="445" font-family="Arial" font-size="11" fill="#8b97c6">• Cellular Biology</text>
  <text x="615" y="465" font-family="Arial" font-size="11" fill="#8b97c6">• Photosynthesis</text>
  <text x="615" y="485" font-family="Arial" font-size="11" fill="#8b97c6">• Ecosystem Dynamics</text>
  
  <!-- Bottom Navigation Bar -->
  <rect x="0" y="540" width="800" height="60" fill="#1a1e2e" rx="8" ry="8"/>
  
  <!-- Nav Icons -->
  <circle cx="100" cy="570" r="20" fill="#354052"/>
  <text x="88" y="576" font-family="Arial" font-size="20" fill="#e0e6ff">🗺️</text>
  <text x="90" y="600" font-family="Arial" font-size="10" fill="#8b97c6">Map</text>
  
  <circle cx="200" cy="570" r="20" fill="#2a324b"/>
  <text x="188" y="576" font-family="Arial" font-size="20" fill="#e0e6ff">📋</text>
  <text x="180" y="600" font-family="Arial" font-size="10" fill="#8b97c6">Quests</text>
  
  <circle cx="300" cy="570" r="20" fill="#2a324b"/>
  <text x="288" y="576" font-family="Arial" font-size="20" fill="#e0e6ff">🧪</text>
  <text x="284" y="600" font-family="Arial" font-size="10" fill="#8b97c6">Lab</text>
  
  <circle cx="400" cy="570" r="20" fill="#2a324b"/>
  <text x="388" y="576" font-family="Arial" font-size="20" fill="#e0e6ff">📚</text>
  <text x="375" y="600" font-family="Arial" font-size="10" fill="#8b97c6">Knowledge</text>
  
  <circle cx="500" cy="570" r="20" fill="#2a324b"/>
  <text x="488" y="576" font-family="Arial" font-size="20" fill="#e0e6ff">👤</text>
  <text x="480" y="600" font-family="Arial" font-size="10" fill="#8b97c6">Profile</text>
  
  <circle cx="600" cy="570" r="20" fill="#2a324b"/>
  <text x="588" y="576" font-family="Arial" font-size="20" fill="#e0e6ff">🏆</text>
  <text x="575" y="600" font-family="Arial" font-size="10" fill="#8b97c6">Achievements</text>
  
  <circle cx="700" cy="570" r="20" fill="#2a324b"/>
  <text x="688" y="576" font-family="Arial" font-size="20" fill="#e0e6ff">⚙️</text>
  <text x="690" y="600" font-family="Arial" font-size="10" fill="#8b97c6">Settings</text>
</svg>
