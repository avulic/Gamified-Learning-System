<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#222639" rx="8" ry="8"/>
  
  <!-- Header/Status Bar -->
  <rect x="0" y="0" width="800" height="60" fill="#1a1e2e" rx="8" ry="8"/>
  
  <!-- Character Name and Level -->
  <text x="30" y="38" font-family="Arial" font-size="18" fill="#e0e6ff" font-weight="bold">Alex the Biologist</text>
  <text x="220" y="38" font-family="Arial" font-size="16" fill="#8b97c6">Level 12 | Knowledge Path: Life Sciences</text>
  
  <!-- Status Indicators -->
  <rect x="550" y="15" width="100" height="30" fill="#2a324b" rx="15" ry="15"/>
  <text x="565" y="35" font-family="Arial" font-size="14" fill="#4fc3f7">XP: 2450/3000</text>
  
  <rect x="670" y="15" width="100" height="30" fill="#2a324b" rx="15" ry="15"/>
  <text x="685" y="35" font-family="Arial" font-size="14" fill="#81c784">Quests: 4</text>
  
  <!-- Task View Tabs -->
  <rect x="30" y="80" width="140" height="40" fill="#2a324b" rx="6" ry="6"/>
  <text x="70" y="105" font-family="Arial" font-size="14" fill="#e0e6ff">Task View</text>
  
  <rect x="180" y="80" width="180" height="40" fill="#2a324b" rx="6" ry="6"/>
  <text x="215" y="105" font-family="Arial" font-size="14" fill="#e0e6ff">Inventory/Achievements</text>
  
  <rect x="370" y="80" width="140" height="40" fill="#4fc3f7" rx="6" ry="6"/>
  <text x="390" y="105" font-family="Arial" font-size="14" fill="#222639">Progress Map</text>
  
  <rect x="520" y="80" width="140" height="40" fill="#2a324b" rx="6" ry="6"/>
  <text x="550" y="105" font-family="Arial" font-size="14" fill="#e0e6ff">Leaderboard</text>
  
  <!-- Main Progress Map Area -->
  <rect x="30" y="140" width="740" height="400" fill="#2a324b" stroke="#5d6e91" stroke-width="2" rx="8" ry="8"/>
  
  <!-- Map Title -->
  <text x="50" y="170" font-family="Arial" font-size="18" fill="#e0e6ff" font-weight="bold">Biology Learning Path</text>
  
  <!-- Path Start -->
  <circle cx="100" cy="220" r="25" fill="#4fc3f7"/>
  <text x="100" y="225" font-family="Arial" font-size="14" fill="#222639" font-weight="bold" text-anchor="middle">START</text>
  
  <!-- Learning Path Line -->
  <line x1="125" y1="220" x2="175" y2="220" stroke="#81c784" stroke-width="4"/>
  
  <!-- Node 1 - Biology Basics -->
  <circle cx="200" cy="220" r="30" fill="#81c784"/>
  <text x="200" y="215" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">Biology</text>
  <text x="200" y="230" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">Basics</text>
  <text x="200" y="255" font-family="Arial" font-size="10" fill="#e0e6ff" text-anchor="middle">100% Complete</text>
  
  <!-- Path Line 1-2 -->
  <line x1="230" y1="220" x2="270" y2="220" stroke="#81c784" stroke-width="4"/>
  
  <!-- Node 2 - Cell Structure -->
  <circle cx="300" cy="220" r="30" fill="#81c784"/>
  <text x="300" y="215" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">Cell</text>
  <text x="300" y="230" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">Structure</text>
  <text x="300" y="255" font-family="Arial" font-size="10" fill="#e0e6ff" text-anchor="middle">100% Complete</text>
  
  <!-- Path Branch 1 (Upper) -->
  <line x1="330" y1="220" x2="370" y2="180" stroke="#81c784" stroke-width="4"/>
  
  <!-- Node 3A - Photosynthesis -->
  <circle cx="400" cy="180" r="30" fill="#81c784"/>
  <text x="400" y="175" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">Photo-</text>
  <text x="400" y="190" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">synthesis</text>
  <text x="400" y="215" font-family="Arial" font-size="10" fill="#e0e6ff" text-anchor="middle">85% Complete</text>
  
  <!-- Path Line 3A-4A -->
  <line x1="430" y1="180" x2="470" y2="180" stroke="#81c784" stroke-width="4"/>
  
  <!-- Node 4A - Plant Biology -->
  <circle cx="500" cy="180" r="30" fill="#4fc3f7" stroke="#81c784" stroke-width="2"/>
  <text x="500" y="175" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">Plant</text>
  <text x="500" y="190" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">Biology</text>
  <text x="500" y="215" font-family="Arial" font-size="10" fill="#e0e6ff" text-anchor="middle">40% Complete</text>
  
  <!-- Path Line 4A-5A -->
  <line x1="530" y1="180" x2="570" y2="180" stroke="#5d6e91" stroke-width="4" stroke-dasharray="5,5"/>
  
  <!-- Node 5A - Ecology -->
  <circle cx="600" cy="180" r="30" fill="#354052" stroke="#5d6e91" stroke-width="2"/>
  <text x="600" y="175" font-family="Arial" font-size="12" fill="#8b97c6" font-weight="bold" text-anchor="middle">Ecology</text>
  <text x="600" y="190" font-family="Arial" font-size="12" fill="#8b97c6" font-weight="bold" text-anchor="middle">Systems</text>
  <text x="600" y="215" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Locked</text>
  
  <!-- Path Line 5A-6A -->
  <line x1="630" y1="180" x2="670" y2="180" stroke="#5d6e91" stroke-width="4" stroke-dasharray="5,5"/>
  
  <!-- Node 6A - Conservation -->
  <circle cx="700" cy="180" r="30" fill="#354052" stroke="#5d6e91" stroke-width="2"/>
  <text x="700" y="175" font-family="Arial" font-size="12" fill="#8b97c6" font-weight="bold" text-anchor="middle">Conser-</text>
  <text x="700" y="190" font-family="Arial" font-size="12" fill="#8b97c6" font-weight="bold" text-anchor="middle">vation</text>
  <text x="700" y="215" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Locked</text>
  
  <!-- Path Branch 2 (Lower) -->
  <line x1="330" y1="220" x2="370" y2="260" stroke="#81c784" stroke-width="4"/>
  
  <!-- Node 3B - Cellular Respiration -->
  <circle cx="400" cy="260" r="30" fill="#81c784"/>
  <text x="400" y="255" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">Cellular</text>
  <text x="400" y="270" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">Respiration</text>
  <text x="400" y="295" font-family="Arial" font-size="10" fill="#e0e6ff" text-anchor="middle">75% Complete</text>
  
  <!-- Path Line 3B-4B -->
  <line x1="430" y1="260" x2="470" y2="260" stroke="#81c784" stroke-width="4"/>
  
  <!-- Node 4B - Genetics -->
  <circle cx="500" cy="260" r="30" fill="#4fc3f7" stroke="#81c784" stroke-width="2"/>
  <text x="500" y="255" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">Genetics</text>
  <text x="500" y="270" font-family="Arial" font-size="12" fill="#222639" font-weight="bold" text-anchor="middle">DNA</text>
  <text x="500" y="295" font-family="Arial" font-size="10" fill="#e0e6ff" text-anchor="middle">30% Complete</text>
  
  <!-- Path Line 4B-5B -->
  <line x1="530" y1="260" x2="570" y2="260" stroke="#5d6e91" stroke-width="4" stroke-dasharray="5,5"/>
  
  <!-- Node 5B - Evolution -->
  <circle cx="600" cy="260" r="30" fill="#354052" stroke="#5d6e91" stroke-width="2"/>
  <text x="600" y="255" font-family="Arial" font-size="12" fill="#8b97c6" font-weight="bold" text-anchor="middle">Evolution</text>
  <text x="600" y="270" font-family="Arial" font-size="12" fill="#8b97c6" font-weight="bold" text-anchor="middle">Theory</text>
  <text x="600" y="295" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Locked</text>
  
  <!-- Path Line 5B-6B -->
  <line x1="630" y1="260" x2="670" y2="260" stroke="#5d6e91" stroke-width="4" stroke-dasharray="5,5"/>
  
  <!-- Node 6B - Biodiversity -->
  <circle cx="700" cy="260" r="30" fill="#354052" stroke="#5d6e91" stroke-width="2"/>
  <text x="700" y="255" font-family="Arial" font-size="12" fill="#8b97c6" font-weight="bold" text-anchor="middle">Bio-</text>
  <text x="700" y="270" font-family="Arial" font-size="12" fill="#8b97c6" font-weight="bold" text-anchor="middle">diversity</text>
  <text x="700" y="295" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Locked</text>
  
  <!-- Specialization Paths -->
  <text x="400" y="330" font-family="Arial" font-size="16" fill="#e0e6ff" font-weight="bold" text-anchor="middle">Specialization Paths</text>
  
  <!-- Specialization 1 -->
  <rect x="100" y="350" width="170" height="60" rx="10" ry="10" fill="#354052" stroke="#5d6e91" stroke-width="1"/>
  <text x="185" y="375" font-family="Arial" font-size="14" fill="#e0e6ff" font-weight="bold" text-anchor="middle">Molecular Biology</text>
  <text x="185" y="395" font-family="Arial" font-size="12" fill="#8b97c6" text-anchor="middle">Requires Genetics 70%</text>
  
  <!-- Specialization 2 -->
  <rect x="315" y="350" width="170" height="60" rx="10" ry="10" fill="#354052" stroke="#5d6e91" stroke-width="1"/>
  <text x="400" y="375" font-family="Arial" font-size="14" fill="#e0e6ff" font-weight="bold" text-anchor="middle">Environmental Science</text>
  <text x="400" y="395" font-family="Arial" font-size="12" fill="#8b97c6" text-anchor="middle">Requires Ecology 50%</text>
  
  <!-- Specialization 3 -->
  <rect x="530" y="350" width="170" height="60" rx="10" ry="10" fill="#354052" stroke="#5d6e91" stroke-width="1"/>
  <text x="615" y="375" font-family="Arial" font-size="14" fill="#e0e6ff" font-weight="bold" text-anchor="middle">Marine Biology</text>
  <text x="615" y="395" font-family="Arial" font-size="12" fill="#8b97c6" text-anchor="middle">Requires Ecology 50%</text>
  
  <!-- Progress Legend -->
  <rect x="100" y="430" width="20" height="10" fill="#81c784"/>
  <text x="125" y="440" font-family="Arial" font-size="12" fill="#e0e6ff">Completed</text>
  
  <rect x="210" y="430" width="20" height="10" fill="#4fc3f7"/>
  <text x="235" y="440" font-family="Arial" font-size="12" fill="#e0e6ff">In Progress</text>
  
  <rect x="320" y="430" width="20" height="10" fill="#354052"/>
  <text x="345" y="440" font-family="Arial" font-size="12" fill="#e0e6ff">Locked</text>
  
  <rect x="430" y="430" width="20" height="10" fill="none" stroke="#81c784" stroke-width="4"/>
  <text x="455" y="440" font-family="Arial" font-size="12" fill="#e0e6ff">Available Path</text>
  
  <rect x="570" y="430" width="20" height="10" fill="none" stroke="#5d6e91" stroke-width="4" stroke-dasharray="5,5"/>
  <text x="595" y="440" font-family="Arial" font-size="12" fill="#e0e6ff">Future Path</text>
  
  <!-- Bottom Navigation Bar -->
  <rect x="0" y="550" width="800" height="50" fill="#1a1e2e" rx="8" ry="8"/>
  <text x="400" y="580" font-family="Arial" font-size="14" fill="#e0e6ff" text-anchor="middle">Biology | Chemistry | Physics | Math | View All Paths</text>
</svg>
