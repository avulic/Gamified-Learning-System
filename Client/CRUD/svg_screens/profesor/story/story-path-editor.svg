<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f7fa" rx="8" ry="8"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#9c27b0" rx="8" ry="8"/>
  <text x="30" y="38" font-family="Arial" font-size="22" fill="white" font-weight="bold">Story Path Editor</text>
  
  <!-- Tab Navigation -->
  <rect x="30" y="80" width="140" height="40" fill="#e1bee7" rx="6" ry="6"/>
  <text x="70" y="105" font-family="Arial" font-size="14" fill="#9c27b0">Story Editor</text>
  
  <rect x="180" y="80" width="140" height="40" fill="#e1bee7" rx="6" ry="6"/>
  <text x="200" y="105" font-family="Arial" font-size="14" fill="#9c27b0">Dialogue Creator</text>
  
  <rect x="330" y="80" width="140" height="40" fill="#9c27b0" rx="6" ry="6"/>
  <text x="350" y="105" font-family="Arial" font-size="14" fill="white">Story Path Editor</text>
  
  <!-- Quest Selection Area -->
  <rect x="30" y="140" width="170" height="430" fill="white" stroke="#ddd" stroke-width="1" rx="6" ry="6"/>
  <rect x="30" y="140" width="170" height="40" fill="#f0f3f9" rx="6" ry="6"/>
  <text x="45" y="165" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Story Quests</text>
  
  <!-- Quest List -->
  <rect x="45" y="190" width="140" height="35" fill="#9c27b0" rx="4" ry="4"/>
  <text x="55" y="212" font-family="Arial" font-size="13" fill="white">Photosynthesis Challenge</text>
  
  <rect x="45" y="235" width="140" height="35" fill="#e1bee7" rx="4" ry="4"/>
  <text x="55" y="257" font-family="Arial" font-size="13" fill="#333">Cell Structure Analysis</text>
  
  <rect x="45" y="280" width="140" height="35" fill="#e1bee7" rx="4" ry="4"/>
  <text x="55" y="302" font-family="Arial" font-size="13" fill="#333">Ecosystem Dynamics</text>
  
  <rect x="45" y="325" width="140" height="35" fill="#e1bee7" rx="4" ry="4"/>
  <text x="55" y="347" font-family="Arial" font-size="13" fill="#333">Respiration Mystery</text>
  
  <text x="110" y="390" font-family="Arial" font-size="14" fill="#9c27b0" font-weight="bold">+ Add Quest</text>
  
  <!-- Story Flow Canvas -->
  <rect x="220" y="140" width="550" height="430" fill="white" stroke="#ddd" stroke-width="1" rx="6" ry="6"/>
  <rect x="220" y="140" width="550" height="40" fill="#f0f3f9" rx="6" ry="6"/>
  <text x="240" y="165" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Photosynthesis Challenge Path</text>
  
  <!-- Toolbar -->
  <rect x="220" y="180" width="550" height="30" fill="#f5f7fa"/>
  <rect x="230" y="185" width="70" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="245" y="200" font-family="Arial" font-size="12" fill="#555">Task Node</text>
  
  <rect x="310" y="185" width="80" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="325" y="200" font-family="Arial" font-size="12" fill="#555">Dialogue Node</text>
  
  <rect x="400" y="185" width="80" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="405" y="200" font-family="Arial" font-size="12" fill="#555">Decision Point</text>
  
  <rect x="490" y="185" width="80" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="504" y="200" font-family="Arial" font-size="12" fill="#555">Connector</text>
  
  <rect x="580" y="185" width="60" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="595" y="200" font-family="Arial" font-size="12" fill="#555">Delete</text>
  
  <rect x="650" y="185" width="60" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="665" y="200" font-family="Arial" font-size="12" fill="#555">Align</text>
  
  <!-- Story Path Flow Diagram -->
  <!-- Start Node -->
  <circle cx="320" cy="250" r="25" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="320" y="255" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Start</text>
  
  <!-- Arrow Down -->
  <line x1="320" y1="275" x2="320" y2="295" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9c27b0"/>
    </marker>
  </defs>
  
  <!-- Dialogue Node -->
  <rect x="260" y="295" width="120" height="50" rx="10" ry="10" fill="#e1bee7" stroke="#9c27b0" stroke-width="2"/>
  <text x="320" y="325" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Forest Guide Intro</text>
  
  <!-- Arrow Down -->
  <line x1="320" y1="345" x2="320" y2="365" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decision Point -->
  <polygon points="320,365 350,395 320,425 290,395" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="320" y="400" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Student</text>
  <text x="320" y="415" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Choice</text>
  
  <!-- Arrows from Decision -->
  <line x1="290" y1="395" x2="260" y2="395" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="395" x2="380" y2="395" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="425" x2="320" y2="455" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Task Nodes from Decision -->
  <rect x="180" y="370" width="80" height="50" rx="10" ry="10" fill="#f8bbd0" stroke="#9c27b0" stroke-width="2"/>
  <text x="220" y="400" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Library</text>
  <text x="220" y="415" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Research</text>
  
  <rect x="380" y="370" width="80" height="50" rx="10" ry="10" fill="#f8bbd0" stroke="#9c27b0" stroke-width="2"/>
  <text x="420" y="400" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Field</text>
  <text x="420" y="415" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Observation</text>
  
  <rect x="280" y="455" width="80" height="50" rx="10" ry="10" fill="#f8bbd0" stroke="#9c27b0" stroke-width="2"/>
  <text x="320" y="485" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Lab</text>
  <text x="320" y="500" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Experiment</text>
  
  <!-- Arrows Converging -->
  <line x1="180" y1="420" x2="160" y2="450" stroke="#9c27b0" stroke-width="2"/>
  <line x1="460" y1="420" x2="480" y2="450" stroke="#9c27b0" stroke-width="2"/>
  <line x1="160" y1="450" x2="160" y2="535" stroke="#9c27b0" stroke-width="2"/>
  <line x1="480" y1="450" x2="480" y2="535" stroke="#9c27b0" stroke-width="2"/>
  <line x1="320" y1="505" x2="320" y2="535" stroke="#9c27b0" stroke-width="2"/>
  
  <line x1="160" y1="535" x2="480" y2="535" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Final Task Node -->
  <rect x="500" y="510" width="120" height="50" rx="10" ry="10" fill="#f8bbd0" stroke="#9c27b0" stroke-width="2"/>
  <text x="560" y="540" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Create Diagram</text>
  
  <!-- Educational Requirements Sidebar -->
  <rect x="640" y="250" width="120" height="170" fill="#f3e5f5" stroke="#d1c4e9" stroke-width="1" rx="6" ry="6"/>
  <text x="650" y="270" font-family="Arial" font-size="13" fill="#9c27b0" font-weight="bold">Learning Gates</text>
  
  <rect x="650" y="280" width="100" height="40" fill="white" stroke="#d1c4e9" stroke-width="1" rx="4" ry="4"/>
  <text x="655" y="295" font-family="Arial" font-size="11" fill="#333">Photosynthesis</text>
  <text x="655" y="310" font-family="Arial" font-size="11" fill="#333">Basics Required</text>
  
  <rect x="650" y="330" width="100" height="40" fill="white" stroke="#d1c4e9" stroke-width="1" rx="4" ry="4"/>
  <text x="655" y="345" font-family="Arial" font-size="11" fill="#333">Cell Structure</text>
  <text x="655" y="360" font-family="Arial" font-size="11" fill="#333">Understanding</text>
  
  <rect x="650" y="380" width="100" height="30" fill="#9c27b0" rx="15" ry="15"/>
  <text x="695" y="400" font-family="Arial" font-size="12" fill="white" text-anchor="middle">+ Add Gate</text>
  
  <!-- Navigation Controls -->
  <rect x="220" y="590" width="550" height="30" fill="#f0f3f9" rx="6" ry="6"/>
  
  <rect x="240" y="595" width="70" height="20" fill="#f5f7fa" stroke="#9c27b0" stroke-width="1" rx="10" ry="10"/>
  <text x="255" y="610" font-family="Arial" font-size="12" fill="#9c27b0">Zoom -</text>
  
  <rect x="320" y="595" width="70" height="20" fill="#f5f7fa" stroke="#9c27b0" stroke-width="1" rx="10" ry="10"/>
  <text x="335" y="610" font-family="Arial" font-size="12" fill="#9c27b0">Zoom +</text>
  
  <rect x="400" y="595" width="70" height="20" fill="#f5f7fa" stroke="#9c27b0" stroke-width="1" rx="10" ry="10"/>
  <text x="415" y="610" font-family="Arial" font-size="12" fill="#9c27b0">Center</text>
  
  <rect x="580" y="595" width="80" height="20" fill="#f5f7fa" stroke="#9c27b0" stroke-width="1" rx="10" ry="10"/>
  <text x="595" y="610" font-family="Arial" font-size="12" fill="#9c27b0">Preview</text>
  
  <rect x="670" y="595" width="80" height="20" fill="#9c27b0" rx="10" ry="10"/>
  <text x="695" y="610" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Save</text>
</svg>
