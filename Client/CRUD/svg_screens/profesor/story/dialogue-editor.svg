  <text x="335" y="495" font-family="Arial" font-size="14" fill="#553c9a">
    <tspan x="335" dy="0">We need a powerful data structure</tspan>
    <tspan x="335" dy="20">called a binary search tree to sort</tspan>
    <tspan x="335" dy="20">our scrolls efficiently.</tspan>
  </text>
  
