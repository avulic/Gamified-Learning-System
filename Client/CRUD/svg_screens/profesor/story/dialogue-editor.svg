  </text>
  
  <rect x="35" y="585" width="210" height="50" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <circle cx="60" cy="610" r="15" fill="#68d391" />
  <text x="85" y="605" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">
