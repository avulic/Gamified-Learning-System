<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f7fa" rx="8" ry="8"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#ff7043" rx="8" ry="8"/>
  <text x="30" y="38" font-family="Arial" font-size="22" fill="white" font-weight="bold">Lesson Creator</text>
  
  <!-- Tab Navigation -->
  <rect x="30" y="80" width="140" height="40" fill="#ff7043" rx="6" ry="6"/>
  <text x="60" y="105" font-family="Arial" font-size="14" fill="white">Lesson Creator</text>
  
  <rect x="180" y="80" width="160" height="40" fill="#ffded5" rx="6" ry="6"/>
  <text x="200" y="105" font-family="Arial" font-size="14" fill="#ff7043">Assignment Workshop</text>
  
  <rect x="350" y="80" width="140" height="40" fill="#ffded5" rx="6" ry="6"/>
  <text x="380" y="105" font-family="Arial" font-size="14" fill="#ff7043">Task Editor</text>
  
  <rect x="500" y="80" width="140" height="40" fill="#ffded5" rx="6" ry="6"/>
  <text x="510" y="105" font-family="Arial" font-size="14" fill="#ff7043">Entity-Task Mapper</text>
  
  <!-- Lesson Metadata -->
  <rect x="30" y="140" width="740" height="90" fill="#f9f9f9" stroke="#ddd" stroke-width="1" rx="6" ry="6"/>
  
  <text x="50" y="165" font-family="Arial" font-size="14" fill="#555" font-weight="bold">Lesson Title:</text>
  <rect x="150" y="150" width="300" height="25" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="160" y="167" font-family="Arial" font-size="14" fill="#333">The Principles of Photosynthesis</text>
  
  <text x="50" y="200" font-family="Arial" font-size="14" fill="#555" font-weight="bold">Module:</text>
  <rect x="150" y="185" width="200" height="25" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="160" y="202" font-family="Arial" font-size="14" fill="#333">Module 3: Photosynthesis</text>
  
  <text x="500" y="165" font-family="Arial" font-size="14" fill="#555" font-weight="bold">Game Location:</text>
  <rect x="610" y="150" width="140" height="25" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="620" y="167" font-family="Arial" font-size="14" fill="#333">Ancient Forest</text>
  
  <text x="500" y="200" font-family="Arial" font-size="14" fill="#555" font-weight="bold">XP Value:</text>
  <rect x="610" y="185" width="70" height="25" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="625" y="202" font-family="Arial" font-size="14" fill="#333">150</text>
  
  <!-- Content Builder -->
  <rect x="30" y="250" width="450" height="320" fill="white" stroke="#ddd" stroke-width="1" rx="6" ry="6"/>
  <rect x="30" y="250" width="450" height="40" fill="#f0f3f9" rx="6" ry="6"/>
  <text x="45" y="275" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Lesson Content</text>
  
  <!-- Rich Text Editor Toolbar -->
  <rect x="30" y="290" width="450" height="30" fill="#f5f7fa"/>
  <rect x="40" y="295" width="25" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="47" y="310" font-family="Arial" font-size="16" fill="#555" font-weight="bold">B</text>
  
  <rect x="70" y="295" width="25" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="77" y="310" font-family="Arial" font-size="16" fill="#555" font-style="italic">I</text>
  
  <rect x="100" y="295" width="45" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="107" y="310" font-family="Arial" font-size="12" fill="#555">H1</text>
  
  <rect x="150" y="295" width="45" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="157" y="310" font-family="Arial" font-size="12" fill="#555">H2</text>
  
  <rect x="200" y="295" width="70" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="210" y="310" font-family="Arial" font-size="12" fill="#555">List</text>
  
  <rect x="275" y="295" width="90" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="282" y="310" font-family="Arial" font-size="12" fill="#555">Interactive</text>
  
  <rect x="370" y="295" width="70" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="380" y="310" font-family="Arial" font-size="12" fill="#555">Media</text>
  
  <!-- Content Area -->
  <text x="50" y="340" font-family="Arial" font-size="18" fill="#333" font-weight="bold">What is Photosynthesis?</text>
  <line x="50" y1="350" x2="430" y2="350" stroke="#eee" stroke-width="1"/>
  
  <text x="50" y="370" font-family="Arial" font-size="14" fill="#333">Photosynthesis is the process used by plants, algae and certain bacteria to harness energy from sunlight and turn it into chemical energy.</text>
  
  <rect x="50" y="390" width="410" height="100" fill="#f9f9f9" rx="4" ry="4"/>
  <text x="65" y="410" font-family="Arial" font-size="12" fill="#777" font-style="italic">Interactive Element: Plant Cell Diagram</text>
  <text x="65" y="430" font-family="Arial" font-size="12" fill="#777" font-style="italic">Students can hover over parts to learn their function</text>
  <text x="65" y="450" font-family="Arial" font-size="12" fill="#777" font-style="italic">Shows chloroplasts and the site of photosynthesis</text>
  
  <text x="50" y="510" font-family="Arial" font-size="14" fill="#333">The process takes place in the chloroplasts, specifically using the green pigment chlorophyll which gives plants their green color.</text>
  
  <!-- Interactive Element Builder -->
  <rect x="500" y="250" width="270" height="320" fill="#f8f9fc" stroke="#ddd" stroke-width="1" rx="6" ry="6"/>
  <rect x="500" y="250" width="270" height="40" fill="#f0f3f9" rx="6" ry="6"/>
  <text x="515" y="275" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Interactive Elements</text>
  
  <!-- Interactive Element Types -->
  <rect x="515" y="300" width="240" height="40" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="530" y="325" font-family="Arial" font-size="14" fill="#333">Plant Cell Diagram</text>
  <circle cx="735" cy="320" r="10" fill="#ff7043"/>
  <text x="732" y="324" font-family="Arial" font-size="14" fill="white">+</text>
  
  <rect x="515" y="350" width="240" height="40" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="530" y="375" font-family="Arial" font-size="14" fill="#333">Photosynthesis Animation</text>
  <circle cx="735" cy="370" r="10" fill="#ff7043"/>
  <text x="732" y="374" font-family="Arial" font-size="14" fill="white">+</text>
  
  <rect x="515" y="400" width="240" height="40" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="530" y="425" font-family="Arial" font-size="14" fill="#333">Interactive Quiz</text>
  <circle cx="735" cy="420" r="10" fill="#ff7043"/>
  <text x="732" y="424" font-family="Arial" font-size="14" fill="white">+</text>
  
  <rect x="515" y="450" width="240" height="40" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="530" y="475" font-family="Arial" font-size="14" fill="#333">Experiment Simulation</text>
  <circle cx="735" cy="470" r="10" fill="#ff7043"/>
  <text x="732" y="474" font-family="Arial" font-size="14" fill="white">+</text>
  
  <rect x="515" y="500" width="240" height="40" fill="white" stroke="#ddd" stroke-width="1" rx="4" ry="4"/>
  <text x="530" y="525" font-family="Arial" font-size="14" fill="#333">Drag &amp; Drop Activity</text>
  <circle cx="735" cy="520" r="10" fill="#ff7043"/>
  <text x="732" y="524" font-family="Arial" font-size="14" fill="white">+</text>
  
  <!-- Bottom Action Bar -->
  <rect x="30" y="590" width="740" height="50" fill="#f0f3f9" rx="6" ry="6"/>
  
  <rect x="450" y="600" width="120" height="30" fill="white" stroke="#ff7043" stroke-width="2" rx="4" ry="4"/>
  <text x="485" y="620" font-family="Arial" font-size="14" fill="#ff7043">Preview</text>
  
  <rect x="580" y="600" width="120" height="30" fill="#ff7043" rx="4" ry="4"/>
  <text x="615" y="620" font-family="Arial" font-size="14" fill="white">Save</text>
</svg>
