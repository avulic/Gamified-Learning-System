<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f0f4f8" />
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#2d3748" />
  <text x="30" y="38" font-family="Arial" font-size="24" fill="#ffffff" font-weight="bold">Course World Editor</text>
  
  <!-- Navigation Tabs -->
  <rect x="300" y="0" width="120" height="60" fill="#4a5568" />
  <text x="360" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#ffffff">World</text>
  
  <rect x="420" y="0" width="120" height="60" fill="#2d3748" />
  <text x="480" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#a0aec0">Modules</text>
  
  <rect x="540" y="0" width="120" height="60" fill="#2d3748" />
  <text x="600" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#a0aec0">Sprites</text>
  
  <rect x="660" y="0" width="120" height="60" fill="#2d3748" />
  <text x="720" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#a0aec0">Tasks</text>
  
  <rect x="780" y="0" width="120" height="60" fill="#2d3748" />
  <text x="840" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#a0aec0">Story</text>
  
  <rect x="900" y="0" width="120" height="60" fill="#2d3748" />
  <text x="960" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#a0aec0">Preview</text>
  
  <rect x="1020" y="0" width="120" height="60" fill="#2d3748" />
  <text x="1080" y="38" font-family="Arial" font-size="16" text-anchor="middle" fill="#a0aec0">Analytics</text>
  
  <!-- Left Tools Panel -->
  <rect x="0" y="60" width="250" height="640" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Tools Header -->
  <rect x="0" y="60" width="250" height="50" fill="#edf2f7" />
  <text x="20" y="92" font-family="Arial" font-size="18" fill="#4a5568" font-weight="bold">World Building Tools</text>
  
  <!-- Tool Categories -->
  <rect x="10" y="120" width="230" height="40" rx="5" fill="#ebf8ff" />
  <text x="30" y="145" font-family="Arial" font-size="16" fill="#2c5282" font-weight="bold">Terrain Types</text>
  
  <!-- Terrain Items -->
  <rect x="20" y="170" width="210" height="35" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <rect x="30" y="177" width="20" height="20" fill="#68d391" />
  <text x="60" y="193" font-family="Arial" font-size="14" fill="#4a5568">Forest (Logic)</text>
  
  <rect x="20" y="210" width="210" height="35" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <rect x="30" y="217" width="20" height="20" fill="#4299e1" />
  <text x="60" y="233" font-family="Arial" font-size="14" fill="#4a5568">Water (Algorithms)</text>
  
  <rect x="20" y="250" width="210" height="35" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <rect x="30" y="257" width="20" height="20" fill="#b794f4" />
  <text x="60" y="273" font-family="Arial" font-size="14" fill="#4a5568">Mountain (Data Struct.)</text>
  
  <rect x="20" y="290" width="210" height="35" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <rect x="30" y="297" width="20" height="20" fill="#f6ad55" />
  <text x="60" y="313" font-family="Arial" font-size="14" fill="#4a5568">Desert (Optimization)</text>
  
  <!-- Structure Category -->
  <rect x="10" y="340" width="230" height="40" rx="5" fill="#ebf8ff" />
  <text x="30" y="365" font-family="Arial" font-size="16" fill="#2c5282" font-weight="bold">Structures</text>
  
  <!-- Structure Items -->
  <rect x="20" y="390" width="210" height="35" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <circle cx="40" cy="407" r="10" fill="#805ad5" />
  <text x="60" y="413" font-family="Arial" font-size="14" fill="#4a5568">Library (Knowledge)</text>
  
  <rect x="20" y="430" width="210" height="35" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <circle cx="40" cy="447" r="10" fill="#e53e3e" />
  <text x="60" y="453" font-family="Arial" font-size="14" fill="#4a5568">Arena (Challenge)</text>
  
  <rect x="20" y="470" width="210" height="35" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <circle cx="40" cy="487" r="10" fill="#f6e05e" />
  <text x="60" y="493" font-family="Arial" font-size="14" fill="#4a5568">Treasury (Rewards)</text>
  
  <!-- Connection Category -->
  <rect x="10" y="520" width="230" height="40" rx="5" fill="#ebf8ff" />
  <text x="30" y="545" font-family="Arial" font-size="16" fill="#2c5282" font-weight="bold">Connections</text>
  
  <!-- Connection Items -->
  <rect x="20" y="570" width="210" height="35" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <line x1="30" y1="587" x2="50" y2="587" stroke="#4a5568" stroke-width="4" />
  <text x="60" y="593" font-family="Arial" font-size="14" fill="#4a5568">Path (Sequential)</text>
  
  <rect x="20" y="610" width="210" height="35" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <line x1="30" y1="627" x2="50" y2="627" stroke="#4a5568" stroke-width="4" stroke-dasharray="5,3" />
  <text x="60" y="633" font-family="Arial" font-size="14" fill="#4a5568">Optional Path</text>
  
  <rect x="20" y="650" width="210" height="35" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <circle cx="40" cy="667" r="10" stroke="#4a5568" stroke-width="2" fill="none" />
  <text x="60" y="673" font-family="Arial" font-size="14" fill="#4a5568">Checkpoint (Test)</text>
  
  <!-- Main Content Area - Course Map -->
  <rect x="250" y="60" width="700" height="640" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Starter Region - Forest/Logic -->
  <path d="M300,150 C350,120 450,130 500,150 C530,180 530,250 490,280 C440,320 350,310 310,270 C280,240 270,180 300,150 Z" fill="#68d391" opacity="0.7" stroke="#2f855a" stroke-width="2" />
  
  <!-- Logic Library -->
  <circle cx="400" cy="200" r="25" fill="#805ad5" />
  <text x="400" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">L1</text>
  
  <!-- Path to Algorithms -->
  <path d="M420,230 C440,270 460,320 480,360" stroke="#4a5568" stroke-width="4" fill="none" />
  
  <!-- Algorithms Region -->
  <path d="M430,360 C480,320 570,320 620,360 C650,400 650,470 610,510 C570,550 480,560 430,520 C390,480 390,410 430,360 Z" fill="#4299e1" opacity="0.7" stroke="#2b6cb0" stroke-width="2" />
  
  <!-- Algorithm Challenge -->
  <circle cx="520" cy="430" r="25" fill="#e53e3e" />
  <text x="520" y="435" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">A1</text>
  
  <!-- Path to Data Structures -->
  <path d="M550,450 C590,480 640,500 680,510" stroke="#4a5568" stroke-width="4" fill="none" />
  
  <!-- Optional Path -->
  <path d="M460,220 C490,240 550,240 670,200" stroke="#4a5568" stroke-width="4" stroke-dasharray="5,3" fill="none" />
  
  <!-- Advanced Topic Region -->
  <path d="M680,200 C730,180 800,210 820,260 C840,320 800,380 750,390 C690,410 640,380 630,320 C620,270 640,220 680,200 Z" fill="#b794f4" opacity="0.7" stroke="#6b46c1" stroke-width="2" />
  
  <!-- Data Structures Checkpoint -->
  <circle cx="750" cy="290" r="25" fill="#ffffff" stroke="#4a5568" stroke-width="3" />
  <text x="750" y="295" font-family="Arial" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="bold">D1</text>
  
  <!-- Path to Final -->
  <path d="M690,510 C720,520 770,520 800,510" stroke="#4a5568" stroke-width="4" fill="none" />
  
  <!-- Final Region -->
  <path d="M800,420 C850,400 900,420 930,470 C950,520 930,580 880,600 C830,620 780,600 760,550 C740,500 760,440 800,420 Z" fill="#f6ad55" opacity="0.7" stroke="#dd6b20" stroke-width="2" />
  
  <!-- Final Challenge -->
  <circle cx="860" cy="520" r="30" fill="#f6e05e" stroke="#d69e2e" stroke-width="3" />
  <text x="860" y="525" font-family="Arial" font-size="14" text-anchor="middle" fill="#744210" font-weight="bold">F</text>
  
  <!-- New Module Button -->
  <circle cx="560" cy="620" r="20" fill="#4299e1" stroke="#2b6cb0" stroke-width="2" />
  <text x="560" y="625" font-family="Arial" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="bold">+</text>
  
  <!-- Right Panel - Properties -->
  <rect x="950" y="60" width="250" height="640" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Properties Header -->
  <rect x="950" y="60" width="250" height="50" fill="#edf2f7" />
  <text x="970" y="92" font-family="Arial" font-size="18" fill="#4a5568" font-weight="bold">Properties</text>
  
  <!-- Selected Item Properties - Data Structures Region -->
  <rect x="960" y="120" width="230" height="40" rx="5" fill="#ebf8ff" />
  <text x="980" y="145" font-family="Arial" font-size="16" fill="#2c5282" font-weight="bold">Selected: Region</text>
  
  <!-- Name -->
  <text x="970" y="185" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">Name:</text>
  <rect x="970" y="195" width="210" height="30" rx="3" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="980" y="215" font-family="Arial" font-size="14" fill="#718096">Data Structures Mountain</text>
  
  <!-- Type -->
  <text x="970" y="245" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">Type:</text>
  <rect x="970" y="255" width="210" height="30" rx="3" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="980" y="275" font-family="Arial" font-size="14" fill="#718096">Mountain (Data Structures)</text>
  
  <!-- Content Area -->
  <text x="970" y="305" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">Content Coverage:</text>
  <rect x="970" y="315" width="210" height="80" rx="3" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="980" y="335" font-family="Arial" font-size="14" fill="#718096">
    <tspan x="980" dy="0">- Trees</tspan>
    <tspan x="980" dy="20">- Graphs</tspan>
    <tspan x="980" dy="20">- Hash Tables</tspan>
  </text>
  
  <!-- Difficulty -->
  <text x="970" y="415" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">Difficulty Level:</text>
  <rect x="970" y="425" width="210" height="30" rx="3" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <rect x="980" y="432" width="100" height="16" rx="8" fill="#b794f4" />
  <text x="1090" y="445" font-family="Arial" font-size="14" fill="#718096">Intermediate</text>
  
  <!-- Prerequisites -->
  <text x="970" y="475" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">Prerequisites:</text>
  <rect x="970" y="485" width="210" height="60" rx="3" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="980" y="505" font-family="Arial" font-size="14" fill="#718096">
    <tspan x="980" dy="0">- Logic Fundamentals</tspan>
    <tspan x="980" dy="20">- Basic Algorithms</tspan>
  </text>
  
  <!-- Modules Inside -->
  <text x="970" y="565" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">Modules Inside:</text>
  <rect x="970" y="575" width="210" height="60" rx="3" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <text x="980" y="595" font-family="Arial" font-size="14" fill="#718096">
    <tspan x="980" dy="0">- Tree Traversal</tspan>
    <tspan x="980" dy="20">- Graph Algorithms</tspan>
  </text>
  
  <!-- Save Button -->
  <rect x="970" y="650" width="210" height="40" rx="5" fill="#4299e1" />
  <text x="1075" y="675" font-family="Arial" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">Save World</text>
</svg>
