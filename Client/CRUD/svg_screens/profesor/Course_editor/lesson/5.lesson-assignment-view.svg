  <text x="540" y="205" font-family="Arial" font-size="16" fill="#2c5282" font-weight="bold">Introduction to Algorithm Analysis</text>
  
  <rect x="520" y="230" width="660" height="70" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="540" y="255" font-family="Arial" font-size="14" fill="#4a5568">In this lesson, we will learn how to analyze algorithms in terms of their efficiency. We'll explore</text>
  <text x="540" y="275" font-family="Arial" font-size="14" fill="#4a5568">the concepts of time complexity and space complexity, and how they help us compare different</text>
  <text x="540" y="295" font-family="Arial" font-size="14" fill="#4a5568">algorithms that solve the same problem.</text>
  
  <!-- Code Example Section -->
  <rect x="520" y="310" width="660" height="40" rx="5" fill="#ebf8ff" />
  <text x="540" y="335" font-family="Arial" font-size="16" fill="#2c5282" font-weight="bold">Example: Linear Search Algorithm</text>
  
  <rect x="520" y="360" width="660" height="120" rx="5" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" />
  <rect x="530" y="370" width="640" height="100" rx="3" fill="#2d3748" />
  <text x="540" y="390" font-family="Courier New" font-size="14" fill="#a0aec0">function linearSearch(arr, target) {</text>
  <text x="540" y="410" font-family="Courier New" font-size="14" fill="#a0aec0">    for (let i = 0; i  arr.length; i++) {</text>
  <text x="540" y="430" font-family="Courier New" font-size="14" fill="#a0aec0">        if (arr[i] === target) return i;</text>
  <text x="540" y="450" font-family="Courier New" font-size="14" fill="#a0aec0">    }</text>
  <text x="540" y="470" font-family="Courier New" font-size="14" fill="#a0aec0">    return -1; // Not found</text>
  <text x="540" y="490" font-family="Courier New" font-size="14" fill="#a0aec0">}</text>
  
