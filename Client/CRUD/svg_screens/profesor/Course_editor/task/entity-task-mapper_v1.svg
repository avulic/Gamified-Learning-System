  <text x="390" y="605" font-family="Arial" font-size="16" fill="#2c5282" font-weight="bold">
    Story Integration
  </text>
  <text x="390" y="630" font-family="Arial" font-size="14" fill="#4a5568">
    <tspan x="390" dy="0">The Elder needs the ancient scrolls organized using a powerful</tspan>
    <tspan x="390" dy="20">system. Only when properly sorted can the knowledge be accessed!</tspan>
  </text>
