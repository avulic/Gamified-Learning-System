  <rect x="1140" y="125" width="30" height="30" rx="3" fill="#4299e1" />
  <text x="1155" y="145" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">🔍</text>
  
  <!-- Entity Tabs -->
  <rect x="870" y="170" width="310" height="40" rx="5" fill="#e2e8f0" />
  
  <rect x="875" y="175" width="100" height="30" rx="5" fill="#4299e1" />
  <text x="925" y="195" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">NPCs</text>
  
  <rect x="975" y="175" width="100" height="30" rx="5" fill="#e2e8f0" />
  <text x="1025" y="195" font-family="Arial" font-size="14" text-anchor="middle" fill="#4a5568">Objects</text>
  
  <rect x="1075" y="175" width="100" height="30" rx="5" fill="#e2e8f0" />
  <text x="1125" y="195" font-family="Arial" font-size="14" text-anchor="middle" fill="#4a5568">Locations</text>
  
  <!-- NPC List -->
  <rect x="870" y="220" width="310" height="410" rx="5" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- NPC Item - Already mapped -->
  <rect x="880" y="230" width="290" height="70" rx="5" fill="#f7fafc" stroke="#38b2ac" stroke-width="2" />
  <circle cx="910" cy="265" r="20" fill="#805ad5" />
  <text x="910" cy="265" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">E</text>
  <text x="940" y="255" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">Village Elder</text>
  <text x="940" y="275" font-family="Arial" font-size="12" fill="#718096">Wise keeper of knowledge</text>
  <rect x="1120" y="255" width="40" height="20" rx="10" fill="#38b2ac" />
  <text x="1140" y="268" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">Used</text>
  
  <!-- NPC Items -->
  <rect x="880" y="310" width="290" height="70" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <circle cx="910" cy="345" r="20" fill="#e53e3e" />
  <text x="910" cy="345" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">W</text>
  <text x="940" y="335" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">Wise Mage</text>
  <text x="940" y="355" font-family="Arial" font-size="12" fill="#718096">Algorithm expert</text>
  <rect x="1120" y="335" width="40" height="20" rx="10" fill="#e2e8f0" />
  <text x="1140" y="348" font-family="Arial" font-size="10" text-anchor="middle" fill="#718096">Add</text>
  
  <rect x="880" y="390" width="290" height="70" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <circle cx="910" cy="425" r="20" fill="#38b2ac" />
  <text x="910" cy="425" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">G</text>
  <text x="940" y="415" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">Guardian</text>
  <text x="940" y="435" font-family="Arial" font-size="12" fill="#718096">Protects valuable data</text>
  <rect x="1120" y="415" width="40" height="20" rx="10" fill="#e2e8f0" />
  <text x="1140" y="428" font-family="Arial" font-size="10" text-anchor="middle" fill="#718096">Add</text>
  
  <rect x="880" y="470" width="290" height="70" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <circle cx="910" cy="505" r="20" fill="#ecc94b" />
  <text x="910" cy="505" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">M</text>
  <text x="940" y="495" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">Merchant</text>
  <text x="940" y="515" font-family="Arial" font-size="12" fill="#718096">Trades knowledge for skills</text>
  <rect x="1120" y="495" width="40" height="20" rx="10" fill="#e2e8f0" />
  <text x="1140" y="508" font-family="Arial" font-size="10" text-anchor="middle" fill="#718096">Add</text>
  
  <rect x="880" y="550" width="290" height="70" rx="5" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" />
  <circle cx="910" cy="585" r="20" fill="#9f7aea" />
  <text x="910" cy="585" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">S</text>
  <text x="940" y="575" font-family="Arial" font-size="14" fill="#4a5568" font-weight="bold">Scholar</text>
  <text x="940" y="595" font-family="Arial" font-size="12" fill="#718096">Challenges with puzzles</text>
  <rect x="1120" y="575" width="40" height="20" rx="10" fill="#e2e8f0" />
  <text x="1140" y="588" font-family="Arial" font-size="10" text-anchor="middle" fill="#718096">Add</text>
  
  <!-- Entity Control Buttons -->
  <rect x="870" y="640" width="150" height="40" rx="5" fill="#4299e1" />
  <text x="945" y="665" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">Create New NPC</text>
  
  <rect x="1030" y="640" width="150" height="40" rx="5" fill="#38b2ac" />
  <text x="1105" y="665" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">Apply Mapping</text>
