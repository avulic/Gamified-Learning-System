<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#222639" rx="8" ry="8"/>
  
  <!-- Header/Status Bar -->
  <rect x="0" y="0" width="800" height="60" fill="#1a1e2e" rx="8" ry="8"/>
  
  <!-- Character Name and Level -->
  <text x="30" y="38" font-family="Arial" font-size="18" fill="#e0e6ff" font-weight="bold">Alex the Biologist</text>
  <text x="220" y="38" font-family="Arial" font-size="16" fill="#8b97c6">Level 12 | Knowledge Path: Life Sciences</text>
  
  <!-- Status Indicators -->
  <rect x="550" y="15" width="100" height="30" fill="#2a324b" rx="15" ry="15"/>
  <text x="565" y="35" font-family="Arial" font-size="14" fill="#4fc3f7">XP: 2450/3000</text>
  
  <rect x="670" y="15" width="100" height="30" fill="#2a324b" rx="15" ry="15"/>
  <text x="685" y="35" font-family="Arial" font-size="14" fill="#81c784">Quests: 4</text>
  
  <!-- Game World Scene -->
  <rect x="0" y="60" width="800" height="390" fill="#2d3d51"/>
  
  <!-- Game Environment - Forest Setting -->
  <!-- Trees -->
  <ellipse cx="100" cy="270" rx="40" ry="90" fill="#1f5e3b"/>
  <ellipse cx="250" cy="230" rx="60" ry="120" fill="#1f5e3b"/>
  <ellipse cx="700" cy="250" rx="50" ry="100" fill="#1f5e3b"/>
  <ellipse cx="500" cy="210" rx="70" ry="130" fill="#1f5e3b"/>
  
  <!-- Forest Ground -->
  <rect x="0" y="350" width="800" height="100" fill="#354b37"/>
  
  <!-- NPC Character - Forest Guide -->
  <circle cx="300" cy="300" r="40" fill="#a5d6a7"/>
  <rect x="290" y="340" width="20" height="40" fill="#66bb6a"/>
  
  <!-- Player Character -->
  <circle cx="500" cy="320" r="30" fill="#4fc3f7"/>
  <polygon points="500,290 485,350 515,350" fill="#7986cb"/>
  
  <!-- Dialogue Box -->
  <rect x="50" y="50" width="700" height="200" fill="#1a1e2e" rx="10" ry="10" opacity="0.95"/>
  
  <!-- NPC Name -->
  <rect x="50" y="50" width="150" height="30" fill="#66bb6a" rx="10" ry="10"/>
  <text x="75" y="70" font-family="Arial" font-size="16" fill="#222639" font-weight="bold">Forest Guide</text>
  
  <!-- Dialogue Text -->
  <text x="70" y="100" font-family="Arial" font-size="16" fill="#e0e6ff">I'm impressed by your understanding of photosynthesis! You've shown how plants</text>
  <text x="70" y="125" font-family="Arial" font-size="16" fill="#e0e6ff">convert sunlight into energy through a complex series of chemical reactions.</text>
  <text x="70" y="150" font-family="Arial" font-size="16" fill="#e0e6ff">Now, I need to understand why some plants in the forest aren't performing this</text>
  <text x="70" y="175" font-family="Arial" font-size="16" fill="#e0e6ff">process efficiently. What factors might be causing this problem?</text>
  
  <!-- Continue Indicator -->
  <text x="720" y="220" font-family="Arial" font-size="20" fill="#f9a825">▼</text>
  
  <!-- Response Options Panel -->
  <rect x="0" y="450" width="800" height="150" fill="#1a1e2e"/>
  
  <!-- Response Options -->
  <rect x="50" y="470" width="700" height="35" fill="#2a324b" rx="17" ry="17"/>
  <text x="70" y="493" font-family="Arial" font-size="14" fill="#e0e6ff">It could be a lack of sunlight due to overcrowding or new growth blocking light.</text>
  
  <rect x="50" y="515" width="700" height="35" fill="#2a324b" rx="17" ry="17"/>
  <text x="70" y="538" font-family="Arial" font-size="14" fill="#e0e6ff">The soil might be depleted of essential nutrients needed for chlorophyll production.</text>
  
  <rect x="50" y="560" width="700" height="35" fill="#2a324b" rx="17" ry="17"/>
  <text x="70" y="583" font-family="Arial" font-size="14" fill="#e0e6ff">Water shortages could be affecting the plant's ability to transport nutrients.</text>
  
  <!-- Learning Context Indicator -->
  <rect x="690" y="450" width="100" height="25" fill="#7e57c2" rx="12" ry="12"/>
  <text x="705" y="467" font-family="Arial" font-size="12" fill="#e0e6ff">Biology Quest</text>
</svg>
