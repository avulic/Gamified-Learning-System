  <circle cx="760" cy="165" r="10" fill="#805ad5" />
  <text x="760" cy="165" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="bold">
    E
  </text>
  <text x="780" y="168" font-family="Arial" font-size="14" fill="#718096">
