<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f7fa" rx="8" ry="8"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#9c27b0" rx="8" ry="8"/>
  <text x="30" y="38" font-family="Arial" font-size="22" fill="white" font-weight="bold">Story Editor</text>
  
  <!-- Tab Navigation -->
  <rect x="30" y="80" width="140" height="40" fill="#9c27b0" rx="6" ry="6"/>
  <text x="70" y="105" font-family="Arial" font-size="14" fill="white">Story Editor</text>
  
  <rect x="180" y="80" width="140" height="40" fill="#e1bee7" rx="6" ry="6"/>
  <text x="200" y="105" font-family="Arial" font-size="14" fill="#9c27b0">Dialogue Creator</text>
  
  <rect x="330" y="80" width="140" height="40" fill="#e1bee7" rx="6" ry="6"/>
  <text x="350" y="105" font-family="Arial" font-size="14" fill="#9c27b0">Story Path Editor</text>
  
  <!-- Story Structure Panel -->
  <rect x="30" y="140" width="250" height="430" fill="white" stroke="#ddd" stroke-width="1" rx="6" ry="6"/>
  <rect x="30" y="140" width="250" height="50" fill="#f0f3f9" rx="6" ry="6"/>
  <text x="45" y="170" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Story Structure</text>
  
  <!-- Story Structure Tree -->
  <rect x="45" y="200" width="220" height="40" fill="#9c27b0" rx="4" ry="4"/>
  <text x="60" y="225" font-family="Arial" font-size="14" fill="white">Main Story Arc</text>
  
  <line x1="65" y1="240" x2="65" y2="260" stroke="#9c27b0" stroke-width="2"/>
  <rect x="65" y="260" width="190" height="35" fill="#e1bee7" rx="4" ry="4"/>
  <text x="80" y="282" font-family="Arial" font-size="13" fill="#333">Chapter 1: Forest Discovery</text>
  
  <line x1="65" y1="295" x2="65" y2="315" stroke="#9c27b0" stroke-width="2"/>
  <rect x="65" y="315" width="190" height="35" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="4" ry="4"/>
  <text x="80" y="337" font-family="Arial" font-size="13" fill="#333">Chapter 2: Plant Mysteries</text>
  
  <line x1="65" y1="350" x2="65" y2="370" stroke="#9c27b0" stroke-width="2"/>
  <rect x="65" y="370" width="190" height="35" fill="#e1bee7" rx="4" ry="4"/>
  <text x="80" y="392" font-family="Arial" font-size="13" fill="#333">Chapter 3: Cell Laboratories</text>
  
  <line x1="65" y1="405" x2="65" y2="425" stroke="#9c27b0" stroke-width="2"/>
  <rect x="65" y="425" width="190" height="35" fill="#e1bee7" rx="4" ry="4"/>
  <text x="80" y="447" font-family="Arial" font-size="13" fill="#333">Chapter 4: Ecosystem Crisis</text>
  
  <line x1="65" y1="460" x2="65" y2="480" stroke="#9c27b0" stroke-width="2"/>
  <rect x="65" y="480" width="190" height="35" fill="#e1bee7" rx="4" ry="4"/>
  <text x="80" y="502" font-family="Arial" font-size="13" fill="#333">Chapter 5: Restoration</text>
  
  <text x="180" y="530" font-family="Arial" font-size="14" fill="#9c27b0" font-weight="bold">+ Add Chapter</text>
  
  <!-- Content Editor -->
  <rect x="300" y="140" width="470" height="430" fill="white" stroke="#ddd" stroke-width="1" rx="6" ry="6"/>
  <rect x="300" y="140" width="470" height="50" fill="#f0f3f9" rx="6" ry="6"/>
  <text x="320" y="170" font-family="Arial" font-size="16" fill="#555" font-weight="bold">Chapter 2: Plant Mysteries</text>
  
  <!-- Editor Toolbar -->
  <rect x="300" y="190" width="470" height="30" fill="#f5f7fa"/>
  <rect x="310" y="195" width="25" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="317" y="210" font-family="Arial" font-size="16" fill="#555" font-weight="bold">B</text>
  
  <rect x="340" y="195" width="25" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="347" y="210" font-family="Arial" font-size="16" fill="#555" font-style="italic">I</text>
  
  <rect x="370" y="195" width="45" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="377" y="210" font-family="Arial" font-size="12" fill="#555">H1</text>
  
  <rect x="420" y="195" width="45" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="427" y="210" font-family="Arial" font-size="12" fill="#555">H2</text>
  
  <rect x="470" y="195" width="70" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="480" y="210" font-family="Arial" font-size="12" fill="#555">List</text>
  
  <rect x="545" y="195" width="90" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="552" y="210" font-family="Arial" font-size="12" fill="#555">Quest Link</text>
  
  <rect x="640" y="195" width="70" height="20" fill="#e0e0e0" rx="3" ry="3"/>
  <text x="650" y="210" font-family="Arial" font-size="12" fill="#555">Media</text>
  
  <!-- Content Area -->
  <text x="320" y="240" font-family="Arial" font-size="16" fill="#333" font-weight="bold">Chapter Overview</text>
  
  <text x="320" y="270" font-family="Arial" font-size="14" fill="#333">In this chapter, students will discover that some plants in the Ancient Forest are showing signs of stress. The normally vibrant forest appears to have patches where plants are struggling to perform photosynthesis efficiently.</text>
  
  <text x="320" y="330" font-family="Arial" font-size="14" fill="#333">The Forest Guide introduces students to the mystery, explaining that something is disrupting the plants' ability to create energy from sunlight. Students must investigate the cellular process of photosynthesis to understand what might be causing the problem.</text>
  
  <text x="320" y="390" font-family="Arial" font-size="16" fill="#333" font-weight="bold">Learning Objectives Integration</text>
  
  <text x="320" y="420" font-family="Arial" font-size="14" fill="#333">• Understand the basic process of photosynthesis</text>
  <text x="320" y="450" font-family="Arial" font-size="14" fill="#333">• Identify the key components required for plants to produce energy</text>
  <text x="320" y="480" font-family="Arial" font-size="14" fill="#333">• Explain the relationship between cellular functions and ecosystem health</text>
  
  <text x="320" y="520" font-family="Arial" font-size="16" fill="#333" font-weight="bold">Associated Quests</text>
  <text x="320" y="550" font-family="Arial" font-size="14" fill="#9c27b0">• The Great Photosynthesis Challenge</text>
</svg>
