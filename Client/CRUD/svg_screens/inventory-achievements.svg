<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#222639" rx="8" ry="8"/>
  
  <!-- Header/Status Bar -->
  <rect x="0" y="0" width="800" height="60" fill="#1a1e2e" rx="8" ry="8"/>
  
  <!-- Character Name and Level -->
  <text x="30" y="38" font-family="Arial" font-size="18" fill="#e0e6ff" font-weight="bold">Alex the Biologist</text>
  <text x="220" y="38" font-family="Arial" font-size="16" fill="#8b97c6">Level 12 | Knowledge Path: Life Sciences</text>
  
  <!-- Status Indicators -->
  <rect x="550" y="15" width="100" height="30" fill="#2a324b" rx="15" ry="15"/>
  <text x="565" y="35" font-family="Arial" font-size="14" fill="#4fc3f7">XP: 2450/3000</text>
  
  <rect x="670" y="15" width="100" height="30" fill="#2a324b" rx="15" ry="15"/>
  <text x="685" y="35" font-family="Arial" font-size="14" fill="#81c784">Quests: 4</text>
  
  <!-- Task View Tabs -->
  <rect x="30" y="80" width="140" height="40" fill="#2a324b" rx="6" ry="6"/>
  <text x="70" y="105" font-family="Arial" font-size="14" fill="#e0e6ff">Task View</text>
  
  <rect x="180" y="80" width="180" height="40" fill="#4fc3f7" rx="6" ry="6"/>
  <text x="215" y="105" font-family="Arial" font-size="14" fill="#222639">Inventory/Achievements</text>
  
  <rect x="370" y="80" width="140" height="40" fill="#2a324b" rx="6" ry="6"/>
  <text x="390" y="105" font-family="Arial" font-size="14" fill="#e0e6ff">Progress Map</text>
  
  <rect x="520" y="80" width="140" height="40" fill="#2a324b" rx="6" ry="6"/>
  <text x="550" y="105" font-family="Arial" font-size="14" fill="#e0e6ff">Leaderboard</text>
  
  <!-- Inventory/Achievements Tabs -->
  <rect x="30" y="140" width="120" height="40" fill="#f9a825" rx="6" ry="6"/>
  <text x="55" y="165" font-family="Arial" font-size="14" fill="#222639">Badges</text>
  
  <rect x="160" y="140" width="120" height="40" fill="#2a324b" rx="6" ry="6"/>
  <text x="185" y="165" font-family="Arial" font-size="14" fill="#e0e6ff">Tools</text>
  
  <rect x="290" y="140" width="120" height="40" fill="#2a324b" rx="6" ry="6"/>
  <text x="315" y="165" font-family="Arial" font-size="14" fill="#e0e6ff">Knowledge</text>
  
  <rect x="420" y="140" width="120" height="40" fill="#2a324b" rx="6" ry="6"/>
  <text x="445" y="165" font-family="Arial" font-size="14" fill="#e0e6ff">Unlocks</text>
  
  <!-- Search Bar -->
  <rect x="570" y="145" width="200" height="30" fill="#354052" rx="15" ry="15"/>
  <text x="590" y="165" font-family="Arial" font-size="12" fill="#8b97c6">🔍 Search achievements...</text>
  
  <!-- Badges Grid -->
  <rect x="30" y="200" width="740" height="380" fill="#2a324b" stroke="#5d6e91" stroke-width="2" rx="8" ry="8"/>
  
  <!-- Badges Section Title -->
  <text x="50" y="230" font-family="Arial" font-size="18" fill="#e0e6ff" font-weight="bold">Achievement Badges</text>
  <text x="50" y="250" font-family="Arial" font-size="12" fill="#8b97c6">Collect badges by completing quests and mastering skills</text>
  
  <!-- Badges - Row 1 -->
  <circle cx="100" cy="310" r="40" fill="#f9a825"/>
  <text x="100" y="315" font-family="Arial" font-size="30" fill="#222639" text-anchor="middle">🌱</text>
  <text x="100" y="365" font-family="Arial" font-size="12" fill="#e0e6ff" text-anchor="middle">Plant Whisperer</text>
  <text x="100" y="380" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Earned: 2 days ago</text>
  
  <circle cx="220" cy="310" r="40" fill="#7e57c2"/>
  <text x="220" y="315" font-family="Arial" font-size="30" fill="#222639" text-anchor="middle">🧫</text>
  <text x="220" y="365" font-family="Arial" font-size="12" fill="#e0e6ff" text-anchor="middle">Cell Biologist</text>
  <text x="220" y="380" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Earned: 1 week ago</text>
  
  <circle cx="340" cy="310" r="40" fill="#4fc3f7"/>
  <text x="340" y="315" font-family="Arial" font-size="30" fill="#222639" text-anchor="middle">🔬</text>
  <text x="340" y="365" font-family="Arial" font-size="12" fill="#e0e6ff" text-anchor="middle">Lab Master</text>
  <text x="340" y="380" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Earned: 2 weeks ago</text>
  
  <circle cx="460" cy="310" r="40" fill="#ef5350"/>
  <text x="460" y="315" font-family="Arial" font-size="30" fill="#222639" text-anchor="middle">⭐</text>
  <text x="460" y="365" font-family="Arial" font-size="12" fill="#e0e6ff" text-anchor="middle">First in Class</text>
  <text x="460" y="380" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Earned: 3 weeks ago</text>
  
  <circle cx="580" cy="310" r="40" fill="#66bb6a"/>
  <text x="580" y="315" font-family="Arial" font-size="30" fill="#222639" text-anchor="middle">🏃</text>
  <text x="580" y="365" font-family="Arial" font-size="12" fill="#e0e6ff" text-anchor="middle">Fast Learner</text>
  <text x="580" y="380" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Earned: 1 month ago</text>
  
  <circle cx="700" cy="310" r="40" fill="#ffa726"/>
  <text x="700" y="315" font-family="Arial" font-size="30" fill="#222639" text-anchor="middle">🏆</text>
  <text x="700" y="365" font-family="Arial" font-size="12" fill="#e0e6ff" text-anchor="middle">Perfect Score</text>
  <text x="700" y="380" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Earned: 1 month ago</text>
  
  <!-- Badges - Row 2 -->
  <circle cx="100" cy="460" r="40" fill="#26a69a"/>
  <text x="100" y="465" font-family="Arial" font-size="30" fill="#222639" text-anchor="middle">🌍</text>
  <text x="100" y="515" font-family="Arial" font-size="12" fill="#e0e6ff" text-anchor="middle">Eco Warrior</text>
  <text x="100" y="530" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Earned: 2 months ago</text>
  
  <circle cx="220" cy="460" r="40" fill="#5c6bc0"/>
  <text x="220" y="465" font-family="Arial" font-size="30" fill="#222639" text-anchor="middle">📊</text>
  <text x="220" y="515" font-family="Arial" font-size="12" fill="#e0e6ff" text-anchor="middle">Data Scientist</text>
  <text x="220" y="530" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Earned: 2 months ago</text>
  
  <circle cx="340" cy="460" r="40" fill="#8d6e63"/>
  <text x="340" y="465" font-family="Arial" font-size="30" fill="#222639" text-anchor="middle">🌳</text>
  <text x="340" y="515" font-family="Arial" font-size="12" fill="#e0e6ff" text-anchor="middle">Forest Explorer</text>
  <text x="340" y="530" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Earned: 3 months ago</text>
  
  <circle cx="460" cy="460" r="40" fill="#ab47bc"/>
  <text x="460" y="465" font-family="Arial" font-size="30" fill="#222639" text-anchor="middle">💡</text>
  <text x="460" y="515" font-family="Arial" font-size="12" fill="#e0e6ff" text-anchor="middle">Innovator</text>
  <text x="460" y="530" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Earned: 3 months ago</text>
  
  <circle cx="580" cy="460" r="40" fill="#9e9e9e" opacity="0.5"/>
  <text x="580" y="465" font-family="Arial" font-size="30" fill="#222639" opacity="0.5" text-anchor="middle">❓</text>
  <text x="580" y="515" font-family="Arial" font-size="12" fill="#8b97c6" text-anchor="middle">Locked Badge</text>
  <text x="580" y="530" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Complete 5 lab tasks</text>
  
  <circle cx="700" cy="460" r="40" fill="#9e9e9e" opacity="0.5"/>
  <text x="700" y="465" font-family="Arial" font-size="30" fill="#222639" opacity="0.5" text-anchor="middle">❓</text>
  <text x="700" y="515" font-family="Arial" font-size="12" fill="#8b97c6" text-anchor="middle">Locked Badge</text>
  <text x="700" y="530" font-family="Arial" font-size="10" fill="#8b97c6" text-anchor="middle">Master all regions</text>
  
  <!-- Page Navigation -->
  <text x="400" y="565" font-family="Arial" font-size="14" fill="#e0e6ff" text-anchor="middle">Page 1 of 3 ◀ ▶</text>
</svg>
